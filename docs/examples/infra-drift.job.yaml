# The mandatory drift-detection companion to infra-deploy.job.yaml (design
# §3.2, §6.6). The fingerprint gate in infra-deploy.job.yaml answers "did my
# code change?" and is blind to drift by construction — a resource edited by
# hand in a cloud console persists until something else catches it. This job
# is the only thing that closes that hole, so it is not optional: run it on a
# schedule (a weekly full-apply with caching disabled is the recommended
# backstop on top of this — see docs/infrastructure-deployment.md).
#
# Reuses infra-deploy.job.yaml's checkout/warm-cache shape and its `tfcache`
# and per-stack `tfstate-<stack>` physical volumes (same docker/podman volume
# names, same kubernetes pvc names) so drift is checked against the SAME
# provider mirror and the SAME state the deploy job manages — not an empty or
# unrelated one. `src` here is this job's own scratch checkout; it does not
# need to be the same physical volume as the deploy job's.
#
# THAT CROSS-JOB SHARING IS DELIBERATE, AND THE LINT CANNOT SEE IT.
# `caesium job lint`'s multi-writer check runs per job definition, so it has no
# idea that this job's `tfcache` and `tfstate-<stack>` name the very stores
# infra-deploy-demo also mounts read-write. Three things make the overlap safe,
# and all three are load-bearing:
#
#   1. `metadata.concurrency` below caps this job at one run and SKIPS rather
#      than queues — a drift check that missed its slot is worthless by the
#      time the queue drains, and a queued pile-up would itself create the
#      overlap this is meant to avoid. It does NOT constrain infra-deploy-demo,
#      which is a separate job with its own admission (concurrency is keyed on
#      job id), so points 2 and 3 have to hold on their own.
#   2. `ARTIFACT_DIR` here is `/state/drift-artifacts`, NOT the deploy job's
#      `/state/artifacts`. `tf-runner` derives TF_DATA_DIR as
#      `<ARTIFACT_DIR>/tfdata` and every phase runs `terraform init
#      -reconfigure` into it; two concurrent inits rewriting one `.terraform/`
#      (backend config, provider links, module manifest) corrupt it SILENTLY —
#      Terraform's state lock does not cover the data directory. Distinct
#      artifact directories are what keep a drift run and a deploy run of the
#      same stack from colliding there.
#   3. The shared provider mirror tolerates concurrent warms *of the same key*
#      by construction (design §3.5/§6.3): `tf-warm` stages into its own
#      `MkdirTemp` directory, promotes it with an atomic rename, adopts the
#      winner if it loses the race, and writes its marker last. Two warms of
#      the same key are therefore idempotent, which is why no named lock is
#      needed. This holds only while both jobs resolve to the SAME provider
#      set: if their `.terraform.lock.hcl` unions ever diverge, they derive
#      different keys and would flip the shared `/cache/terraformrc` back and
#      forth between two mirrors — that is the pre-existing "one `tfcache`
#      volume serves one provider set" limitation, and the two jobs must then
#      be given separate cache volumes.
#
# Volume ownership: every reagent image runs as UID 10001. `tfcache` and the
# `tfstate-<stack>` volumes are this job's SHARED view of the deploy job's
# stores, and both jobs first mount them with reagent images (tf-warm, tf-runner),
# so they need no operator action. `src` here is this job's OWN volume
# (caesium-infra-drift-src) and is first mounted by `prepare`, which runs stock
# alpine:3.23 — so, exactly as in infra-deploy.job.yaml, `prepare` chowns the
# mount to 10001 after clearing it. See
# docs/infrastructure-deployment.md#volume-ownership-the-reagent-images-run-as-uid-10001.
#
# Every drift step below carries an explicit `cache: false`. An OMITTED
# `cache` block is cacheable, not "no cache", whenever
# CAESIUM_CACHE_ENABLED=true (the server-wide default) — and a cached drift
# step would replay `drift: false` forever, defeating the one thing this job
# exists to do (design §6.6: "Drift steps carry no cache block ... caching
# the thing whose entire purpose is to detect out-of-band change would
# defeat it"). Explicit `cache: false` is what actually guarantees that,
# regardless of the server's cache default.
#
# `src` uses `pvc:` on Kubernetes (a pre-provisioned, shared PVC), not
# `claimTemplate` — see the matching note in infra-deploy.job.yaml: a
# `claimTemplate` PVC is scoped to one pod/step, and this volume is mounted
# by every step in the pipeline. `prepare` and `checkout` are its only two
# writers and are DAG-ordered by `next`/`dependsOn`, so the multi-writer
# volume lint (design §8) stays quiet without any volume aliasing; every
# other step mounts `src` `readOnly: true`.
#
# State is one volume PER STACK, exactly as in infra-deploy.job.yaml. The
# named-volume/PVC sources used here honour `subPath` on Docker, Podman, and
# Kubernetes, but separate volumes are the proven pattern and avoid coupling
# the job to Docker Engine API >= 1.45.
# `accessMode: ReadWriteMany` is declared on every volume more than one step
# mounts.
$schema: https://yourorg.io/schemas/job.v1.json
apiVersion: v1
kind: Job
metadata:
  alias: infra-drift-demo
  labels:
    team: platform
    feature: infra-deploy
  annotations:
    purpose: "Scheduled drift detection over the stacks infra-deploy-demo manages"
  # One drift run at a time, and `skip` rather than `queue`: a drift check that
  # missed its window is stale by the time a queue drains, and overlapping runs
  # would write the same shared state volumes and provider mirror concurrently.
  # See point 1 of the cross-job sharing note above.
  concurrency:
    maxRuns: 1
    strategy: skip
trigger:
  type: cron
  configuration:
    cron: "0 6 * * *"
volumes:
  - name: src
    accessMode: ReadWriteMany
    sources:
      docker:
        volume: caesium-infra-drift-src
      podman:
        volume: caesium-infra-drift-src
      kubernetes:
        pvc: caesium-infra-drift-src-rwx
  - name: tfcache
    accessMode: ReadWriteMany
    sources:
      docker:
        volume: caesium-infra-deploy-tfcache
      podman:
        volume: caesium-infra-deploy-tfcache
      kubernetes:
        pvc: caesium-infra-deploy-tfcache-rwx
  - name: tfstate-network
    accessMode: ReadWriteMany
    sources:
      docker:
        volume: caesium-infra-deploy-tfstate-network
      podman:
        volume: caesium-infra-deploy-tfstate-network
      kubernetes:
        pvc: caesium-infra-deploy-tfstate-network-rwx
  - name: tfstate-account
    accessMode: ReadWriteMany
    sources:
      docker:
        volume: caesium-infra-deploy-tfstate-account
      podman:
        volume: caesium-infra-deploy-tfstate-account
      kubernetes:
        pvc: caesium-infra-deploy-tfstate-account-rwx
  - name: tfstate-app-web
    accessMode: ReadWriteMany
    sources:
      docker:
        volume: caesium-infra-deploy-tfstate-app-web
      podman:
        volume: caesium-infra-deploy-tfstate-app-web
      kubernetes:
        pvc: caesium-infra-deploy-tfstate-app-web-rwx
steps:
  # First container to mount `src`, so on docker/podman it decides the fresh
  # named volume's ownership — and stock alpine:3.23 has no /src, so without
  # the chown the volume would come up root:root and `checkout` (uid 10001)
  # could not write it. The reagent images' baked 10001 ownership of /src does
  # not reach a volume a non-reagent image mounted first.
  - name: prepare
    image: alpine:3.23
    cache: false
    command:
      - "sh"
      - "-c"
      - "find /src -mindepth 1 -delete && chown 10001:10001 /src && chmod 0775 /src && echo cleared"
    volumeMounts:
      - {volume: src, path: /src}
    next: [checkout]

  - name: checkout
    image: caesiumcloud/git-source:latest
    cache: false
    dependsOn: [prepare]
    env:
      GIT_URL: "git@github.com:acme/infra.git"
      GIT_REF: "main"
      GIT_SPARSE: "stacks/** modules/**"
      GIT_SSH_KEY: "secret://env/DEPLOY_KEY"
    volumeMounts:
      - {volume: src, path: /src}
    next: [warm-cache]

  - name: warm-cache
    image: caesiumcloud/tf-warm:latest
    cache: false
    dependsOn: [checkout]
    env:
      SRC: "/src"
      CACHE_DIR: "/cache"
    volumeMounts:
      - {volume: src, path: /src, readOnly: true}
      - {volume: tfcache, path: /cache}
    next: [drift-network, drift-account, drift-app-web]

  - name: drift-network
    image: caesiumcloud/tf-runner:latest
    command: ["tf-drift"]
    cache: false
    dependsOn: [warm-cache]
    env:
      STACK_ROOT: "/src/stacks/network"
      TF_WORKSPACE: "default"
      TF_CLI_CONFIG_FILE: "/cache/terraformrc"
      ARTIFACT_DIR: "/state/drift-artifacts"
      BACKEND_CONFIG: "path=/state/terraform.tfstate"
    volumeMounts:
      - {volume: src, path: /src, readOnly: true}
      - {volume: tfstate-network, path: /state}
      - {volume: tfcache, path: /cache, readOnly: true}

  - name: drift-account
    image: caesiumcloud/tf-runner:latest
    command: ["tf-drift"]
    cache: false
    dependsOn: [warm-cache]
    env:
      STACK_ROOT: "/src/stacks/account"
      TF_WORKSPACE: "default"
      TF_CLI_CONFIG_FILE: "/cache/terraformrc"
      ARTIFACT_DIR: "/state/drift-artifacts"
      BACKEND_CONFIG: "path=/state/terraform.tfstate"
    volumeMounts:
      - {volume: src, path: /src, readOnly: true}
      - {volume: tfstate-account, path: /state}
      - {volume: tfcache, path: /cache, readOnly: true}

  # app-web's own Terraform config declares `variable "vpc_id"` with NO
  # default (a deliberate fail-closed choice in the stack itself — see
  # infra-deploy.job.yaml's plan-app-web step). infra-deploy.job.yaml's
  # `plan`/`apply` steps supply it via IMPORT_OUTPUTS_FROM=apply-network,
  # because an apply step precedes them in that job's DAG. `tf-drift` DOES
  # honour IMPORT_OUTPUTS_FROM the same way `tf-plan` does — but THIS job has
  # no apply step to import from at all (drift never applies), so
  # IMPORT_OUTPUTS_FROM would have nothing to read. Setting it here is now an
  # ERROR, not a silent no-op: every named producer must have published its
  # `caesium_outputs_published` sentinel, and the phase fails naming the
  # missing step rather than importing zero variables and letting Terraform
  # fall back to defaults. The cross-stack variable must be pinned directly
  # instead. Keep this value in sync with
  # infra-deploy-demo's actual `apply-network` output — a stale pin here
  # makes drift compare against the wrong VPC, not against no VPC (the
  # variable has no default, so an unset value fails the step outright rather
  # than masking the problem).
  - name: drift-app-web
    image: caesiumcloud/tf-runner:latest
    command: ["tf-drift"]
    cache: false
    dependsOn: [warm-cache]
    env:
      STACK_ROOT: "/src/stacks/app-web"
      TF_WORKSPACE: "default"
      TF_CLI_CONFIG_FILE: "/cache/terraformrc"
      ARTIFACT_DIR: "/state/drift-artifacts"
      BACKEND_CONFIG: "path=/state/terraform.tfstate"
      TF_VAR_vpc_id: "vpc-REPLACE-WITH-infra-deploy-demo's-apply-network-vpc_id-output"
    volumeMounts:
      - {volume: src, path: /src, readOnly: true}
      - {volume: tfstate-app-web, path: /state}
      - {volume: tfcache, path: /cache, readOnly: true}
