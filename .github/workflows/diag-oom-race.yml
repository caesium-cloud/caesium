name: diag-oom-race

# DIAG ONLY -- never merged. Probe: check the bpftrace program loads on each
# runner and records a container OOM timeline.
on:
  push:
    branches: [diag/oom-cgroup-race]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Build fixture
        run: docker build -q -f build/Dockerfile.stress -t caesiumdiag/stress:diag .
      - name: Start tracer
        run: |
          sudo apt-get update -q >/dev/null
          sudo apt-get install -y -q bpftrace >/dev/null
          mkdir -p "$RUNNER_TEMP/out"
          bash diag/trace-start.sh "$RUNNER_TEMP/out" verbose
      - name: Trials
        run: bash diag/loop.sh docker caesiumdiag/stress:diag 3 "$RUNNER_TEMP/out"
      - name: Summarize
        if: always()
        run: |
          sudo pkill -INT -x bpftrace || true
          sleep 2
          sudo chown -R "$(id -u)" "$RUNNER_TEMP/out" || true
          tail -c 3000 "$RUNNER_TEMP/out/trace.err" || true
          grep -c . "$RUNNER_TEMP/out/trace.log" || true
          python3 diag/summarize.py "$RUNNER_TEMP/out" "${{ matrix.runner }}/probe"
          head -c 30000 "$RUNNER_TEMP/out/timelines.txt" || true
