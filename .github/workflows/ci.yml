name: CI

# PRs run once (the pull_request event). Pushes to feature branches do not
# duplicate that. master and v* tags still run the full workflow on push.
#
# merge_group (distributed-testing G7): wired so a merge queue is activatable
# by a repository-settings change alone -- no ruleset exists today (2026-09-16
# `gh api repos/caesium-cloud/caesium/rulesets` returned `[]`), so this trigger
# never fires yet and every merge_group-specific path below is proven only
# statically (actionlint + scripts/test_ci.py), never by a live run. See the
# G7 note in docs/exec-plans/active/distributed-testing.md.
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  merge_group:
    types: [checks_requested]

concurrency:
  # A merge_group run must never share a group with, or be cancelled by, a PR
  # run: name its group from the queue entry's own head SHA rather than
  # falling through to `github.ref` (which merge_group also sets, but keying
  # off it here would tie the two event types' fates together implicitly).
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.event_name == 'merge_group' && format('mergegroup-{0}', github.event.merge_group.head_sha)) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
  CAESIUM_EVENT_INGEST_API_KEY: integration-test-key

defaults:
  run:
    shell: bash

jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      go: ${{ steps.set.outputs.go }}
      ui: ${{ steps.set.outputs.ui }}
      helm: ${{ steps.set.outputs.helm }}
      reagents: ${{ steps.set.outputs.reagents }}
      ci: ${{ steps.set.outputs.ci }}
      images: ${{ steps.set.outputs.images }}
    steps:
      - uses: actions/checkout@v6
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        with:
          # merge_group has no PR to diff through the GitHub API, so the
          # filter step below falls back to a local `git diff` against
          # `base`, which needs history beyond the default shallow clone.
          # pull_request keeps depth 1 and its existing API-based file list
          # (its `base` input stays unset below).
          #
          # The operands MUST be the strings '0'/'1', not bare numbers: in a
          # GitHub Actions expression, `cond && a || b` is JS-like
          # short-circuit truthiness, and the NUMBER 0 is falsy -- so
          # `cond && 0 || 1` always evaluates to 1 regardless of `cond` (a
          # true `cond && 0` immediately falls through the `|| 1`). The
          # STRING '0' is non-empty and therefore truthy, which is what
          # makes this actually branch. scripts/test_ci.py pins this with a
          # semantic check, not just a text match.
          fetch-depth: ${{ github.event_name == 'merge_group' && '0' || '1' }}
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        with:
          # Empty string reproduces this input's own unset default for
          # pull_request -- verified live by every pull_request run of this
          # workflow, since that is the branch this expression takes there.
          # merge_group has no PR to auto-detect a base from, so it has to
          # name one explicitly; this half of the expression is unverified by
          # any live run (see the `on:` comment above).
          base: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
          filters: |
            go:
              - '**/*.go'
              - '**/testdata/**'
              - 'test/**'
              - 'docs/examples/**'
              - 'docs/examples-k8s/**'
              - '.dockerignore'
              - 'go.mod'
              - 'go.sum'
              - 'build/**'
              - 'justfile'
              - '.golangci.yml'
              - 'caesium.go'
            ui:
              - 'ui/**'
            helm:
              - 'helm/**'
            reagents:
              - 'reagents/**'
              - 'build/Dockerfile.reagents'
            ci:
              - '.github/**'
              - 'scripts/**'
              - 'build/ci.docker-bake.hcl'
              - 'justfile'
      - id: set
        env:
          EVENT: ${{ github.event_name }}
          GO: ${{ steps.filter.outputs.go }}
          UI: ${{ steps.filter.outputs.ui }}
          HELM: ${{ steps.filter.outputs.helm }}
          REAGENTS: ${{ steps.filter.outputs.reagents }}
          CI: ${{ steps.filter.outputs.ci }}
        run: |
          set -euo pipefail
          # push (master/tag) never path-filters: every output is true. This
          # is the only event allowed to skip the checkout/filter steps above.
          if [ "$EVENT" != "pull_request" ] && [ "$EVENT" != "merge_group" ]; then
            {
              echo "go=true"
              echo "ui=true"
              echo "helm=true"
              echo "reagents=true"
              echo "ci=true"
              echo "images=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # pull_request and merge_group both select from the real diff. A
          # filter output that is missing or not exactly true/false -- the
          # step above was skipped, or its `base` ref could not be resolved --
          # must fail this job rather than silently read as false: that would
          # let a required producer skip a change it was never actually
          # compared against.
          for name in GO UI HELM REAGENTS CI; do
            value="${!name:-}"
            case "$value" in
              true|false) ;;
              *)
                echo "changes: $EVENT path-filter output for $name is '$value', not true/false; failing closed instead of treating an unreadable filter as everything-skipped" >&2
                exit 1
                ;;
            esac
          done
          images=false
          if [ "$GO" = true ] || [ "$UI" = true ] || [ "$HELM" = true ] || [ "$REAGENTS" = true ] || [ "$CI" = true ]; then
            images=true
          fi
          {
            echo "go=$GO"
            echo "ui=$UI"
            echo "helm=$HELM"
            echo "reagents=$REAGENTS"
            echo "ci=$CI"
            echo "images=$images"
          } >> "$GITHUB_OUTPUT"

  ci-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Install actionlint
        run: |
          curl -fsSL --retry 3 -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz' | sha256sum -c -
          mkdir -p /tmp/actionlint-bin
          tar -xzf /tmp/actionlint.tar.gz -C /tmp/actionlint-bin actionlint
          echo /tmp/actionlint-bin >> "$GITHUB_PATH"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install kubectl for wrapper contract tests
        run: |
          mkdir -p "$RUNNER_TEMP/wrapper-kubectl"
          cd "$RUNNER_TEMP/wrapper-kubectl"
          curl -fsSLO --retry 3 https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl
          curl -fsSLO --retry 3 https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl.sha256
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum -c -
          chmod +x kubectl
          echo "$RUNNER_TEMP/wrapper-kubectl" >> "$GITHUB_PATH"
      - name: Validate workflow and CI contracts
        run: |
          actionlint .github/workflows/ci.yml
          python3 -m pip install PyYAML==6.0.3
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          bash scripts/test_helm_pod_replacement_membership.sh

  builder:
    permissions:
      contents: read
      actions: read # Cache lookup; cache uploads use the Actions runtime token.
    needs: [changes]
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile.build
          target: builder-full
          load: true
          provenance: false
          sbom: false
          tags: |
            caesiumcloud/caesium-builder:${{ env.IMAGE_TAG }}-amd64-full
            caesiumcloud/caesium-builder:${{ env.IMAGE_TAG }}-amd64
          cache-from: type=gha,scope=builder-linux-amd64
          cache-to: type=gha,mode=max,scope=builder-linux-amd64,ignore-error=true
          build-args: |
            TARGETARCH=amd64
      - uses: ./.github/actions/save-docker-images
        with:
          name: builder-amd64
          images: >-
            caesiumcloud/caesium-builder:${{ env.IMAGE_TAG }}-amd64
            caesiumcloud/caesium-builder:${{ env.IMAGE_TAG }}-amd64-full

  builder-arm64:
    permissions:
      contents: read
      actions: read # Cache lookup; cache uploads use the Actions runtime token.
    needs: [changes]
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile.build
          target: builder-full
          load: true
          provenance: false
          sbom: false
          tags: |
            caesiumcloud/caesium-builder:${{ env.IMAGE_TAG }}-arm64-full
            caesiumcloud/caesium-builder:${{ env.IMAGE_TAG }}-arm64
          cache-from: type=gha,scope=builder-linux-arm64
          cache-to: type=gha,mode=max,scope=builder-linux-arm64,ignore-error=true
          build-args: |
            TARGETARCH=arm64
      - uses: ./.github/actions/save-docker-images
        with:
          name: builder-arm64
          images: >-
            caesiumcloud/caesium-builder:${{ env.IMAGE_TAG }}-arm64
            caesiumcloud/caesium-builder:${{ env.IMAGE_TAG }}-arm64-full

  images:
    permissions:
      contents: read
      actions: read # BuildKit cache lookup; uploads use the runtime token.
    needs: [changes, builder]
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@just
      - uses: ./.github/actions/bake-images
        with:
          arch: amd64
          # `robustness` layers the compiled ./test/robustness binary onto the
          # same release target, so it shares this bake's graph.
          targets: |
            product
            robustness
          cache-group: product
      - name: Build triage-agent
        run: just tag=${{ env.IMAGE_TAG }}-amd64 build-triage-agent
      - name: Extract static CLI (amd64)
        run: |
          set -euo pipefail
          ctr="$(docker create caesium-cli-static:${{ env.IMAGE_TAG }}-amd64)"
          docker cp "$ctr":/cli/caesium /tmp/caesium-linux-amd64
          docker rm -f "$ctr"
          chmod +x /tmp/caesium-linux-amd64
      - name: Bare-host smoke test (amd64, native)
        run: scripts/ci-cli-smoke.sh /tmp/caesium-linux-amd64 amd64
      - uses: ./.github/actions/save-docker-images
        with:
          name: product-amd64
          images: >-
            caesiumcloud/caesium:${{ env.IMAGE_TAG }}-amd64
            caesiumcloud/caesium:${{ env.IMAGE_TAG }}-amd64-test
      - uses: ./.github/actions/save-docker-images
        with:
          name: triage-amd64
          images: >-
            caesiumcloud/triage-agent:${{ env.IMAGE_TAG }}-amd64
            caesiumcloud/triage-agent:latest
      - uses: ./.github/actions/save-docker-images
        with:
          name: integration-runner-amd64
          images: caesiumcloud/caesium-integration:${{ env.IMAGE_TAG }}-amd64
      - uses: ./.github/actions/save-docker-images
        with:
          name: robustness-amd64
          images: caesiumcloud/caesium-robustness:${{ env.IMAGE_TAG }}-amd64
      - uses: actions/upload-artifact@v7
        with:
          name: release-cli-amd64
          path: |
            /tmp/caesium-linux-amd64
            /tmp/caesium-linux-amd64.smoke-ok
          retention-days: 1
          compression-level: 0

  images-arm64:
    permissions:
      contents: read
      actions: read
    needs: [changes, builder-arm64]
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/bake-images
        with:
          arch: arm64
          targets: product
          cache-group: product
      - name: Extract static CLI (arm64)
        run: |
          set -euo pipefail
          ctr="$(docker create caesium-cli-static:${{ env.IMAGE_TAG }}-arm64)"
          docker cp "$ctr":/cli/caesium /tmp/caesium-linux-arm64
          docker rm -f "$ctr"
          chmod +x /tmp/caesium-linux-arm64
      - name: Bare-host smoke test (arm64, native)
        run: scripts/ci-cli-smoke.sh /tmp/caesium-linux-arm64 arm64
      - uses: ./.github/actions/save-docker-images
        with:
          name: product-arm64
          images: >-
            caesiumcloud/caesium:${{ env.IMAGE_TAG }}-arm64
            caesiumcloud/caesium:${{ env.IMAGE_TAG }}-arm64-test
      - uses: ./.github/actions/save-docker-images
        with:
          name: integration-runner-arm64
          images: caesiumcloud/caesium-integration:${{ env.IMAGE_TAG }}-arm64
      - uses: actions/upload-artifact@v7
        with:
          name: release-cli-arm64
          path: |
            /tmp/caesium-linux-arm64
            /tmp/caesium-linux-arm64.smoke-ok
          retention-days: 1
          compression-level: 0

  # Parallel with `images`: lint/unit-test only need the reagent toolchain,
  # and the infra lane needs the four role images. Keeping this off the
  # product bake means Docker integration can start as soon as `images`
  # finishes.
  reagents:
    permissions:
      contents: read
      actions: read
    needs: [changes]
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.reagents == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/bake-images
        with:
          arch: amd64
          targets: reagents
          cache-group: reagents
      - uses: ./.github/actions/save-docker-images
        with:
          name: reagents-amd64
          images: >-
            caesiumcloud/git-source:${{ env.IMAGE_TAG }}-amd64
            caesiumcloud/tf-discover:${{ env.IMAGE_TAG }}-amd64
            caesiumcloud/tf-warm:${{ env.IMAGE_TAG }}-amd64
            caesiumcloud/tf-runner:${{ env.IMAGE_TAG }}-amd64
      - uses: ./.github/actions/save-docker-images
        with:
          name: reagent-toolchain-amd64
          images: caesiumcloud/caesium-reagent-toolchain:${{ env.IMAGE_TAG }}-amd64

  reagents-arm64:
    permissions:
      contents: read
      actions: read
    needs: [changes]
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.reagents == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/bake-images
        with:
          arch: arm64
          targets: reagent-roles
          cache-group: reagents
      - uses: ./.github/actions/save-docker-images
        with:
          name: reagents-arm64
          images: >-
            caesiumcloud/git-source:${{ env.IMAGE_TAG }}-arm64
            caesiumcloud/tf-discover:${{ env.IMAGE_TAG }}-arm64
            caesiumcloud/tf-warm:${{ env.IMAGE_TAG }}-arm64
            caesiumcloud/tf-runner:${{ env.IMAGE_TAG }}-arm64

  lint:
    needs: [changes, builder, reagents]
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.reagents == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CAESIUM_SKIP_IMAGE_BUILD: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@just
      - uses: ./.github/actions/load-docker-images
        with:
          name: builder-amd64
      - uses: ./.github/actions/load-docker-images
        with:
          name: reagent-toolchain-amd64
      - name: Lint
        run: just tag=${{ env.IMAGE_TAG }}-amd64 lint
      - name: Lint reagents module
        run: just tag=${{ env.IMAGE_TAG }}-amd64 reagents-lint

  helm-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v5
        with:
          version: v3.17.0
      - name: Helm lint
        run: helm lint ./helm/caesium
      - name: Helm template
        run: helm template caesium ./helm/caesium --values ./helm/caesium/ci/test-values.yaml

  unit-test:
    needs: [changes, builder, reagents]
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.reagents == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CAESIUM_SKIP_IMAGE_BUILD: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@just
      - uses: ./.github/actions/load-docker-images
        with:
          name: builder-amd64
      - uses: ./.github/actions/load-docker-images
        with:
          name: reagent-toolchain-amd64
      - name: Unit tests
        run: just tag=${{ env.IMAGE_TAG }}-amd64 unit-test
      - name: Reagents unit tests
        run: just tag=${{ env.IMAGE_TAG }}-amd64 reagents-test

  unit-test-arm64:
    needs: [changes, builder-arm64]
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@just
      - uses: ./.github/actions/load-docker-images
        with:
          name: builder-arm64
      - name: Unit tests (arm64)
        run: just tag=${{ env.IMAGE_TAG }}-arm64 unit-test

  ui-test:
    needs: [changes]
    if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: UI lint, unit tests, and production build
        working-directory: ui
        run: npm ci --prefer-offline && npm run lint && npm test && npm run build:ci

  # Each full Docker shard owns a server. The two legacy required check names
  # below aggregate this matrix so branch protection needs no immediate change.
  integration:
    name: integration (${{ matrix.id == 'docker' && format('docker, {0}/3', matrix.shard) || matrix.id }})
    needs: [changes, images]
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: docker
            shard: 1
            recipe: integration-test
            load-triage: "false"
            load-reagents: "false"
            timeout: 45
          - id: docker
            shard: 2
            recipe: integration-test
            load-triage: "false"
            load-reagents: "false"
            timeout: 45
          - id: docker
            shard: 3
            recipe: integration-test
            load-triage: "false"
            load-reagents: "false"
            timeout: 45
          - id: agent-auth
            shard: ""
            recipe: integration-test-agent
            load-triage: "true"
            load-reagents: "false"
            timeout: 45
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/run-integration
        with:
          arch: amd64
          recipe: ${{ matrix.recipe }}
          shard-index: ${{ matrix.shard }}
          shard-count: ${{ matrix.id == 'docker' && '3' || '' }}
          load-triage: ${{ matrix.load-triage }}
          load-reagents: ${{ matrix.load-reagents }}

  # Not required-to-merge (flake history, see docs/ci.md §2).
  integration-extra:
    name: integration-extra (${{ matrix.id }})
    needs: [changes, images, reagents]
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.reagents == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: distributed
            recipe: integration-test-distributed
            load-reagents: "false"
            timeout: 45
          - id: owner-memory
            recipe: integration-test-owner-memory
            load-reagents: "false"
            timeout: 45
          - id: infra
            recipe: integration-test-infra
            load-reagents: "true"
            timeout: 60
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/run-integration
        with:
          arch: amd64
          recipe: ${{ matrix.recipe }}
          load-reagents: ${{ matrix.load-reagents }}

  integration-arm64:
    name: integration-arm64 (${{ matrix.id == 'docker' && format('docker, {0}/3', matrix.shard) || matrix.id }})
    needs: [changes, images-arm64, reagents-arm64]
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.reagents == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: docker
            shard: 1
            recipe: integration-test
            load-reagents: "false"
            timeout: 45
          - id: docker
            shard: 2
            recipe: integration-test
            load-reagents: "false"
            timeout: 45
          - id: docker
            shard: 3
            recipe: integration-test
            load-reagents: "false"
            timeout: 45
          - id: infra
            shard: ""
            recipe: integration-test-infra
            load-reagents: "true"
            timeout: 60
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/run-integration
        with:
          arch: arm64
          recipe: ${{ matrix.recipe }}
          shard-index: ${{ matrix.shard }}
          shard-count: ${{ matrix.id == 'docker' && '3' || '' }}
          load-reagents: ${{ matrix.load-reagents }}

  ui-e2e:
    needs: [changes, ui-test, images]
    if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/load-docker-images
        with:
          name: product-amd64
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI dependencies and browsers
        id: dependencies
        working-directory: ui
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Pre-pull job images
        id: job-images
        run: |
          docker pull alpine:3.23
          docker pull debian:12-slim
      - name: Start Caesium server
        id: server
        run: |
          docker rm -f caesium-server >/dev/null 2>&1 || true
          docker run -d --name caesium-server \
            -p 8080:8080 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e DOCKER_HOST=unix:///var/run/docker.sock \
            -e CAESIUM_MANUAL_TRIGGER_API_KEY=e2e-test-key \
            -e CAESIUM_OPEN_LINEAGE_ENABLED=true \
            -e CAESIUM_OPEN_LINEAGE_TRANSPORT=console \
            -e CAESIUM_FRESHNESS_ENABLED=true \
            -e CAESIUM_DATA_ASSERTIONS_ENABLED=true \
            -e CAESIUM_CONTRACT_ENFORCEMENT=fail \
            -e CAESIUM_CONTRACT_DEPRECATION_WINDOW=5s \
            -e CAESIUM_CACHE_PIN_DIGESTS=true \
            -e CAESIUM_CACHE_ENABLED=true \
            -e CAESIUM_RUN_QUEUE_ENABLED=true \
            -e CAESIUM_RUN_QUEUE_DEQUEUER_ENABLED=true \
            -e CAESIUM_RUN_QUEUE_DEQUEUE_INTERVAL=500ms \
            --user 0:0 \
            caesiumcloud/caesium:${{ env.IMAGE_TAG }}-amd64 start
          tries=0
          until curl -sf http://127.0.0.1:8080/health >/dev/null; do
            tries=$((tries + 1))
            if [ "$tries" -gt 30 ]; then
              echo "Caesium did not become ready in time"
              exit 1
            fi
            sleep 1
          done
      - name: Run Playwright E2E
        id: playwright
        working-directory: ui
        env:
          CI: 'true'
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
          CAESIUM_MANUAL_TRIGGER_API_KEY: e2e-test-key
        run: |
          set -euo pipefail
          server_pid="$(docker inspect --format '{{.State.Pid}}' caesium-server)"
          case "$server_pid" in
            ''|0|*[!0-9]*) echo "Caesium server PID is invalid: $server_pid" >&2; exit 1 ;;
          esac
          sudo test -e "/proc/$server_pid/ns/net"
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          runner_groups="$(id -G | tr ' ' ',')"
          runner_home="${HOME:?runner HOME is required}"
          runner_path="$PATH"
          runner_pwd="$PWD"
          host_mount_ns="$(readlink /proc/self/ns/mnt)"
          printf 'Host resolver nameservers:\n'
          awk '$1 == "nameserver" { print $2 }' /etc/resolv.conf
          server_resolv_conf="$(docker inspect --format '{{.ResolvConfPath}}' caesium-server)"
          case "$server_resolv_conf" in
            /*) ;;
            *) echo "Caesium resolver path is invalid: $server_resolv_conf" >&2; exit 1 ;;
          esac
          sudo test -f "$server_resolv_conf"
          node_bin="$(command -v node)"
          npm_bin="$(command -v npm)"
          nsenter_bin="$(command -v nsenter)"
          unshare_bin="$(command -v unshare)"
          setpriv_bin="$(command -v setpriv)"
          browser_bin="$("$node_bin" -e 'const { chromium } = require("playwright"); process.stdout.write(chromium.executablePath())')"
          test -x "$node_bin"
          test -x "$npm_bin"
          test -x "$nsenter_bin"
          test -x "$unshare_bin"
          test -x "$setpriv_bin"
          test -x "$browser_bin"
          inner_script="$(cat <<'BASH'
          set -euo pipefail
          test "$(id -u)" = "$CAESIUM_E2E_RUNNER_UID"
          test "$(id -g)" = "$CAESIUM_E2E_RUNNER_GID"
          test "$HOME" = "$CAESIUM_E2E_RUNNER_HOME"
          test "$PATH" = "$CAESIUM_E2E_RUNNER_PATH"
          cd "$CAESIUM_E2E_RUNNER_PWD"
          test "$PWD" = "$CAESIUM_E2E_RUNNER_PWD"
          test "$(command -v node)" = "$CAESIUM_E2E_NODE_BIN"
          test -x "$CAESIUM_E2E_BROWSER_BIN"
          "$CAESIUM_E2E_NODE_BIN" --version
          curl -sf "$PLAYWRIGHT_BASE_URL/health" >/dev/null
          for font_host in fonts.googleapis.com fonts.gstatic.com; do
            if ! getent hosts "$font_host" >/dev/null; then
              echo "::warning::preflight: cannot resolve $font_host (external DNS); continuing to browser assertions" >&2
            fi
          done
          "$CAESIUM_E2E_NODE_BIN" --input-type=module -e '
            import { chromium } from "playwright";
            if (chromium.executablePath() !== process.env.CAESIUM_E2E_BROWSER_BIN) {
              throw new Error("Playwright browser executable changed inside the server namespace")
            }
            const browser = await chromium.launch();
            await browser.close();
          '
          exec "$CAESIUM_E2E_NPM_BIN" run test:e2e -- --project=network-recovery
          BASH
          )"
          mount_script="$(cat <<'BASH'
          set -euo pipefail
          test "$(readlink /proc/self/ns/mnt)" != "$CAESIUM_E2E_HOST_MOUNT_NS"
          test -f "$CAESIUM_E2E_SERVER_RESOLV_CONF"
          mount --make-rprivate /
          mount --bind "$CAESIUM_E2E_SERVER_RESOLV_CONF" /etc/resolv.conf
          test /etc/resolv.conf -ef "$CAESIUM_E2E_SERVER_RESOLV_CONF"
          printf 'Server resolver nameservers:\n'
          awk '$1 == "nameserver" { print $2 }' /etc/resolv.conf
          exec "$CAESIUM_E2E_SETPRIV_BIN" --reuid="$CAESIUM_E2E_RUNNER_UID" --regid="$CAESIUM_E2E_RUNNER_GID" \
            --groups="$CAESIUM_E2E_RUNNER_GROUPS" --inh-caps=-all --ambient-caps=-all \
            --bounding-set=-all --no-new-privs /bin/bash -c "$CAESIUM_E2E_INNER_SCRIPT"
          BASH
          )"
          sudo env \
            HOME="$runner_home" \
            PATH="$runner_path" \
            PWD="$runner_pwd" \
            CI="$CI" \
            PLAYWRIGHT_BASE_URL="$PLAYWRIGHT_BASE_URL" \
            CAESIUM_MANUAL_TRIGGER_API_KEY="$CAESIUM_MANUAL_TRIGGER_API_KEY" \
            CAESIUM_E2E_RUNNER_UID="$runner_uid" \
            CAESIUM_E2E_RUNNER_GID="$runner_gid" \
            CAESIUM_E2E_RUNNER_HOME="$runner_home" \
            CAESIUM_E2E_RUNNER_PATH="$runner_path" \
            CAESIUM_E2E_RUNNER_PWD="$runner_pwd" \
            CAESIUM_E2E_RUNNER_GROUPS="$runner_groups" \
            CAESIUM_E2E_HOST_MOUNT_NS="$host_mount_ns" \
            CAESIUM_E2E_SERVER_RESOLV_CONF="$server_resolv_conf" \
            CAESIUM_E2E_NODE_BIN="$node_bin" \
            CAESIUM_E2E_NPM_BIN="$npm_bin" \
            CAESIUM_E2E_BROWSER_BIN="$browser_bin" \
            CAESIUM_E2E_SETPRIV_BIN="$setpriv_bin" \
            CAESIUM_E2E_INNER_SCRIPT="$inner_script" \
            "$nsenter_bin" --target "$server_pid" --net \
              "$unshare_bin" --mount --propagation private /bin/bash -c "$mount_script"
      - name: Collect browser diagnostics
        if: always()
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          mkdir -p ui/ci-diagnostics
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path

          steps = json.loads(os.environ["STEP_RESULTS"])
          report = {
              "schema_version": 1,
              "candidate_sha": os.environ["CANDIDATE_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "job": os.environ["GITHUB_JOB"],
              "steps": {name: {key: step[key] for key in ("outcome", "conclusion")}
                        for name, step in steps.items()},
          }
          Path("ui/ci-diagnostics/outcomes.json").write_text(json.dumps(report, indent=2) + "\n")
          PYTHON
          # Artifact bytes do not honor the runner's add-mask directives.
          python3 - <<'PYTHON'
          import base64
          import io
          from pathlib import Path
          import re
          import subprocess
          import sys
          import zipfile

          def sanitize(data, archive=False):
              if archive:
                  output = io.BytesIO()
                  with zipfile.ZipFile(io.BytesIO(data)) as source, zipfile.ZipFile(output, "w") as target:
                      for entry in source.infolist():
                          target.writestr(entry, sanitize(source.read(entry), entry.filename.endswith(".zip")))
                  return output.getvalue()
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  return data  # Preserve binary images, fonts and video.
              # Playwright HTML embeds a base64 ZIP containing its JSON report.
              text = re.sub(
                  r"data:application/zip;base64,([A-Za-z0-9+/=]+)",
                  lambda match: "data:application/zip;base64," + base64.b64encode(
                      sanitize(base64.b64decode(match[1], validate=True), archive=True)
                  ).decode("ascii"), text,
              )
              return re.sub(r"csk_[A-Za-z0-9_-]+", "[REDACTED_API_KEY]", text).encode("utf-8")

          status = 0
          for filename, command in (
              ("server.log", ["docker", "logs", "caesium-server"]),
              ("containers.log", ["docker", "ps", "-a"]),
          ):
              result = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              log = result.stdout.decode("utf-8", errors="replace")
              log = re.sub(r"csk_[A-Za-z0-9_-]+", "[REDACTED_API_KEY]", log)
              Path("ui/ci-diagnostics", filename).write_text(log)
              if result.returncode:
                  print(f"::error::Could not collect {filename}; see diagnostic artifact")
                  status = 1
          # Upload only the sanitized copy. A malformed archive fails this
          # step without falling back to raw traces, snapshots or reports.
          for source in (Path("ui/ci-diagnostics"), Path("ui/playwright-results.json"),
                         Path("ui/test-results"), Path("ui/playwright-report")):
              files = source.rglob("*") if source.is_dir() else [source]
              for path in files:
                  if not path.is_file():
                      continue
                  clean = sanitize(path.read_bytes(), path.suffix == ".zip")
                  target = Path("ui/ci-artifacts") / path.relative_to("ui")
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(clean)
          sys.exit(status)
          PYTHON
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-e2e-diag-${{ github.run_attempt }}
          path: ui/ci-artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Stop Caesium server
        if: always()
        run: docker rm -f caesium-server >/dev/null 2>&1 || true

  ui-e2e-auth:
    needs: [changes, ui-test, images]
    if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/load-docker-images
        with:
          name: product-amd64
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI dependencies and browsers
        id: dependencies
        run: |
          cd ui
          npm ci
          npx playwright install --with-deps chromium
      - name: Pre-pull job images
        id: job-images
        run: |
          docker pull alpine:3.23
      - name: Start auth-enabled Caesium server
        id: server
        run: |
          docker rm -f caesium-server-auth >/dev/null 2>&1 || true
          docker run -d --name caesium-server-auth \
            -p 8080:8080 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e DOCKER_HOST=unix:///var/run/docker.sock \
            -e CAESIUM_MANUAL_TRIGGER_API_KEY=e2e-test-key \
            -e CAESIUM_AUTH_MODE=api-key \
            -e CAESIUM_AUTH_KEY_HASH_SECRET=ui-e2e-auth-key-hash-secret-000001 \
            -e CAESIUM_AUTH_REQUIRE_TLS=false \
            -e CAESIUM_OPEN_LINEAGE_ENABLED=true \
            -e CAESIUM_OPEN_LINEAGE_TRANSPORT=console \
            -e CAESIUM_FRESHNESS_ENABLED=true \
            -e CAESIUM_DATA_ASSERTIONS_ENABLED=true \
            -e CAESIUM_CONTRACT_ENFORCEMENT=fail \
            -e CAESIUM_CONTRACT_DEPRECATION_WINDOW=5s \
            -e CAESIUM_CACHE_PIN_DIGESTS=true \
            -e CAESIUM_CACHE_ENABLED=true \
            -e CAESIUM_AGENT_REMEDIATION_ENABLED=true \
            --user 0:0 \
            caesiumcloud/caesium:${{ env.IMAGE_TAG }}-amd64 start
          tries=0
          until node -e "fetch('http://127.0.0.1:8080/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; do
            tries=$((tries + 1))
            if [ "$tries" -gt 30 ]; then
              echo "Auth-enabled Caesium did not become ready in time"
              exit 1
            fi
            sleep 1
          done
      - name: Capture auth bootstrap admin key
        id: bootstrap
        run: |
          admin_key=""
          tries=0
          until admin_key="$(docker logs caesium-server-auth 2>&1 | awk '/csk_/ { for (i = 1; i <= NF; i++) if ($i ~ /^csk_/) { print $i; exit } }')" && [ -n "$admin_key" ]; do
            tries=$((tries + 1))
            if [ "$tries" -gt 30 ]; then
              echo "Auth bootstrap admin key did not appear in server logs"
              exit 1
            fi
            sleep 1
          done
          echo "::add-mask::$admin_key"
          echo "CAESIUM_E2E_AUTH_ADMIN_KEY=$admin_key" >> "$GITHUB_ENV"
      - name: Run auth-enabled Playwright E2E
        id: playwright
        working-directory: ui
        run: npm run test:e2e -- --project=auth
      - name: Collect browser diagnostics
        if: always()
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          mkdir -p ui/ci-diagnostics
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path

          steps = json.loads(os.environ["STEP_RESULTS"])
          report = {
              "schema_version": 1,
              "candidate_sha": os.environ["CANDIDATE_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "job": os.environ["GITHUB_JOB"],
              "steps": {name: {key: step[key] for key in ("outcome", "conclusion")}
                        for name, step in steps.items()},
          }
          Path("ui/ci-diagnostics/outcomes.json").write_text(json.dumps(report, indent=2) + "\n")
          PYTHON
          # Artifact bytes do not honor the runner's add-mask directives.
          python3 - <<'PYTHON'
          import base64
          import io
          from pathlib import Path
          import re
          import subprocess
          import sys
          import zipfile

          def sanitize(data, archive=False):
              if archive:
                  output = io.BytesIO()
                  with zipfile.ZipFile(io.BytesIO(data)) as source, zipfile.ZipFile(output, "w") as target:
                      for entry in source.infolist():
                          target.writestr(entry, sanitize(source.read(entry), entry.filename.endswith(".zip")))
                  return output.getvalue()
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  return data  # Preserve binary images, fonts and video.
              # Playwright HTML embeds a base64 ZIP containing its JSON report.
              text = re.sub(
                  r"data:application/zip;base64,([A-Za-z0-9+/=]+)",
                  lambda match: "data:application/zip;base64," + base64.b64encode(
                      sanitize(base64.b64decode(match[1], validate=True), archive=True)
                  ).decode("ascii"), text,
              )
              return re.sub(r"csk_[A-Za-z0-9_-]+", "[REDACTED_API_KEY]", text).encode("utf-8")

          status = 0
          for filename, command in (
              ("server.log", ["docker", "logs", "caesium-server-auth"]),
              ("containers.log", ["docker", "ps", "-a"]),
          ):
              result = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              log = result.stdout.decode("utf-8", errors="replace")
              log = re.sub(r"csk_[A-Za-z0-9_-]+", "[REDACTED_API_KEY]", log)
              Path("ui/ci-diagnostics", filename).write_text(log)
              if result.returncode:
                  print(f"::error::Could not collect {filename}; see diagnostic artifact")
                  status = 1
          # Upload only the sanitized copy. A malformed archive fails this
          # step without falling back to raw traces, snapshots or reports.
          for source in (Path("ui/ci-diagnostics"), Path("ui/playwright-results.json"),
                         Path("ui/test-results"), Path("ui/playwright-report")):
              files = source.rglob("*") if source.is_dir() else [source]
              for path in files:
                  if not path.is_file():
                      continue
                  clean = sanitize(path.read_bytes(), path.suffix == ".zip")
                  target = Path("ui/ci-artifacts") / path.relative_to("ui")
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(clean)
          sys.exit(status)
          PYTHON
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-e2e-auth-diag-${{ github.run_attempt }}
          path: ui/ci-artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Stop auth-enabled Caesium server
        if: always()
        run: docker rm -f caesium-server-auth >/dev/null 2>&1 || true

  helm-integration-test:
    needs: [changes, images, helm-lint]
    if: needs.changes.outputs.helm == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.ci == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/load-docker-images
        with:
          name: product-amd64
      - uses: ./.github/actions/load-docker-images
        with:
          name: integration-runner-amd64
      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x ./kubectl
          sudo mv ./kubectl /usr/local/bin/kubectl
      - uses: azure/setup-helm@v5
        with:
          version: v3.17.0
      - name: Create kind cluster
        run: kind create cluster --wait 120s
      - name: Load Caesium image into kind
        run: kind load docker-image caesiumcloud/caesium:${{ env.IMAGE_TAG }}-amd64
      - name: Helm install
        run: |
          if ! helm install caesium ./helm/caesium \
            --values ./helm/caesium/ci/test-values-k8s.yaml \
            --set image.tag=${{ env.IMAGE_TAG }}-amd64 \
            --wait --timeout 240s; then
            kubectl get pods -A || true
            kubectl get events --sort-by=.lastTimestamp -A | tail -n 200 || true
            kubectl describe statefulset caesium || true
            kubectl describe pods -l app.kubernetes.io/instance=caesium || true
            kubectl logs statefulset/caesium -c caesium || true
            kubectl logs statefulset/caesium -c peer-discovery || true
            exit 1
          fi
      - name: Helm test
        run: helm test caesium --timeout 90s
      - name: Pre-load job images into kind
        run: |
          docker pull alpine:3.23
          kind load docker-image alpine:3.23
      - name: Start port-forward to Caesium
        run: |
          kubectl port-forward service/caesium 8080:8080 >/tmp/port-forward.log 2>&1 &
          echo $! > /tmp/port-forward.pid

          tries=0
          until curl -sf http://127.0.0.1:8080/health >/dev/null; do
            tries=$((tries + 1))
            if [ "$tries" -gt 30 ]; then
              echo "Port-forward did not become ready in time"
              cat /tmp/port-forward.log || true
              kubectl get pods -A || true
              exit 1
            fi
            sleep 1
          done
      - name: Extract caesium CLI
        run: |
          mkdir -p .tmp/caesium-cli
          ctr=$(docker create caesiumcloud/caesium:${{ env.IMAGE_TAG }}-amd64)
          docker cp "$ctr":/bin/caesium .tmp/caesium-cli/caesium
          docker rm -f "$ctr"
          chmod +x .tmp/caesium-cli/caesium
      - name: Full integration suite (Kubernetes, shard ${{ matrix.shard }}/3)
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$(pwd)":/bld/caesium \
            -e CAESIUM_TEST_SHARD_INDEX=${{ matrix.shard }} \
            -e CAESIUM_TEST_SHARD_COUNT=3 \
            -e CAESIUM_TEST_ENGINE=kubernetes \
            -e CAESIUM_CLI_PATH=/bld/caesium/.tmp/caesium-cli/caesium \
            --network=host \
            -w /bld/caesium \
            caesiumcloud/caesium-integration:${{ env.IMAGE_TAG }}-amd64 \
            sh scripts/integration-test.sh
      - name: Download static host CLI for cache identity regression
        if: matrix.shard == 1
        uses: actions/download-artifact@v8
        with:
          name: release-cli-amd64
          path: .tmp/cache-identity-cli
      - name: Kubernetes mutable-tag cache identity (local and distributed)
        if: matrix.shard == 1
        run: |
          set -euo pipefail
          mkdir -p .tmp/kubernetes-cache-identity
          chmod +x .tmp/cache-identity-cli/caesium-linux-amd64
          python3 test/kubernetes_cache_identity.py --cli .tmp/cache-identity-cli/caesium-linux-amd64 --mode local 2>&1 | tee .tmp/kubernetes-cache-identity/local.log
          kill "$(cat /tmp/port-forward.pid)" 2>/dev/null || true
          kubectl set env statefulset/caesium CAESIUM_EXECUTION_MODE=distributed
          kubectl rollout status statefulset/caesium --timeout=240s
          kubectl port-forward service/caesium 8080:8080 >/tmp/port-forward.log 2>&1 &
          echo $! > /tmp/port-forward.pid
          ready=false
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/health >/dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/port-forward.log; exit 1; fi
          python3 test/kubernetes_cache_identity.py --cli .tmp/cache-identity-cli/caesium-linux-amd64 --mode distributed 2>&1 | tee .tmp/kubernetes-cache-identity/distributed.log
      - name: Record Kubernetes cache identity scenarios that could not run
        if: always() && matrix.shard == 1
        run: |
          mkdir -p .tmp/kubernetes-cache-identity
          for mode in local distributed; do
            evidence=".tmp/kubernetes-cache-identity/$mode.log"
            if [ ! -f "$evidence" ]; then
              printf '{"result":"not_run","mode":"%s","reason":"scenario did not run; inspect prerequisite or earlier mode failure"}\n' "$mode" > "$evidence"
            fi
          done
      - name: Retain Kubernetes cache identity evidence
        if: always() && matrix.shard == 1
        uses: actions/upload-artifact@v7
        with:
          name: kubernetes-cache-identity
          path: .tmp/kubernetes-cache-identity/
          if-no-files-found: error
      - name: Distributed Kubernetes deadline regression
        if: matrix.shard == 1
        run: |
          set -euo pipefail
          # The complete three-shard suite above stays local, and the cache
          # identity controls run before these deadline-specific distributed settings.
          kill "$(cat /tmp/port-forward.pid)" 2>/dev/null || true
          kubectl set env statefulset/caesium --containers=caesium \
            CAESIUM_EXECUTION_MODE=distributed \
            CAESIUM_RUN_OWNER_ENABLED=true \
            CAESIUM_WORKER_ENABLED=true \
            CAESIUM_INTERNAL_WAKEUP_TOKEN=integration-distributed-internal-token \
            CAESIUM_INTERNAL_PORT=8443 \
            CAESIUM_RUN_LEASE_TTL=30s \
            CAESIUM_RUN_OWNER_DISPATCH_INTERVAL=500ms \
            CAESIUM_RUN_OWNER_DISPATCH_DEADLINE=5m \
            CAESIUM_WORKER_POOL_SIZE=1 \
            CAESIUM_WORKER_POLL_INTERVAL=500ms \
            CAESIUM_WORKER_RECLAIM_INTERVAL=500ms \
            CAESIUM_WORKER_LEASE_TTL=30s
          # Preserve the chart's POD_IP-based database/node address.
          kubectl rollout status statefulset/caesium --timeout=240s
          kubectl port-forward service/caesium 8080:8080 >/tmp/port-forward.log 2>&1 &
          echo $! > /tmp/port-forward.pid
          ready=false
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/health >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat /tmp/port-forward.log
            exit 1
          fi

          mkdir -p .tmp
          kind get kubeconfig > .tmp/deadline-kubeconfig
          chmod 600 .tmp/deadline-kubeconfig
          # kind may list its IPv6 subnet first, or omit that subnet's gateway.
          # The witness listens on IPv4, so select a matching gateway explicitly.
          network_config=$(docker network inspect kind --format '{{json .IPAM.Config}}')
          witness_host=$(python3 -c '
          import ipaddress, json, sys
          for config in json.load(sys.stdin):
              gateway = config.get("Gateway")
              if gateway and ipaddress.ip_address(gateway).version == 4:
                  print(gateway)
                  break
          ' <<< "$network_config")
          if [ -z "$witness_host" ]; then
            echo "kind network has no IPv4 gateway for the deadline witness: $network_config" >&2
            exit 1
          fi
          echo "Kubernetes deadline witness gateway: $witness_host"
          deadline_log=.tmp/distributed-kubernetes-deadlines.log
          docker run --rm \
            -v "$(pwd)":/bld/caesium \
            -v "$(pwd)/.tmp/deadline-kubeconfig":/tmp/deadline-kubeconfig:ro \
            -e KUBECONFIG=/tmp/deadline-kubeconfig \
            -e CAESIUM_TEST_WITNESS_HOST="$witness_host" \
            -e CAESIUM_TEST_ENGINE=kubernetes \
            -e CAESIUM_EXECUTION_MODE=distributed \
            -e CAESIUM_CLI_PATH=/bld/caesium/.tmp/caesium-cli/caesium \
            --network=host \
            -w /bld/caesium \
            caesiumcloud/caesium-integration:${{ env.IMAGE_TAG }}-amd64 \
            sh scripts/integration-test.sh \
              -test.run '^TestIntegrationTestSuite$' \
              -testify.m '^TestDistributedKubernetesDeadlines$' | tee "$deadline_log"
          # A missing method or skipped subcase must not report green coverage.
          if ! grep -Eq -- '--- PASS: TestIntegrationTestSuite/TestDistributedKubernetesDeadlines \(' "$deadline_log"; then
            echo "Distributed Kubernetes deadline scenario did not pass" >&2
            exit 1
          fi
          if grep -Eq -- '--- SKIP: TestIntegrationTestSuite/TestDistributedKubernetesDeadlines' "$deadline_log"; then
            echo "Distributed Kubernetes deadline scenario skipped required coverage" >&2
            exit 1
          fi
      - name: Stop port-forward
        if: always()
        run: kill "$(cat /tmp/port-forward.pid)" 2>/dev/null || true
      - name: Dump logs on failure
        if: failure()
        run: |
          kubectl logs statefulset/caesium -c caesium || true
          kubectl get pods -A || true
          kubectl describe pods -l cloud.caesium -A || true

  # Issue #493: an ordinary StatefulSet pod replacement hands the pod a new IP
  # while its PVC — and the dqlite address recorded inside it — survives. This
  # lane replaces all three replicas in turn on retained volumes, fails unless
  # the pod IP actually changed, and asserts the member rejoins the dqlite
  # cluster at its new address with prior runs readable and new jobs executing.
  # The other Helm lanes cannot catch this: they run one replica with
  # persistence disabled, so every boot writes a fresh info.yaml.
  helm-pod-replacement-test:
    needs: [changes, images, helm-lint]
    if: needs.changes.outputs.helm == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/load-docker-images
        with:
          name: product-amd64
      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x ./kubectl
          sudo mv ./kubectl /usr/local/bin/kubectl
      - uses: azure/setup-helm@v5
        with:
          version: v3.17.0
      - name: Pre-pull the task image
        run: docker pull alpine:3.23
      - name: Replace every replica on retained volumes
        env:
          CAESIUM_REPLACEMENT_ID: rp-${{ github.run_id }}
          CAESIUM_REPLACEMENT_ARTIFACTS: ${{ github.workspace }}/.tmp/pod-replacement
          CAESIUM_REPLACEMENT_IMAGE: caesiumcloud/caesium:${{ env.IMAGE_TAG }}-amd64
          CAESIUM_REPLACEMENT_KIND_IMAGE: kindest/node:v1.36.1
          CAESIUM_REPLACEMENT_TASK_IMAGE: alpine:3.23
        run: bash scripts/helm-pod-replacement.sh
      - name: Upload pod-replacement artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: helm-pod-replacement
          path: .tmp/pod-replacement/
          if-no-files-found: warn
          retention-days: 7

  # First persistent three-node robustness lane: B1's owner-crash regression on
  # kind + the Helm StatefulSet, plus E5's SQL-work budget on the existing
  # Docker integration server. Both reduce to one scenario evidence report that
  # scripts/check-test-evidence.py validates against test/contracts/scenarios.json,
  # failing closed on a missing artifact or scenario, an unexpected skip, a
  # disabled gate, wrong topology/mode/flags, a wrong candidate identity or
  # absent fault-activation evidence.
  #
  # PROMOTED (distributed-testing G5): this lane is part of the fail-closed
  # `ci-ok` aggregate, which also gates `publish`. `ci-ok` itself is NOT one of
  # master's eight required status checks, so until a CODEOWNER adds it the
  # promotion blocks tag publication, not PR merge. Every existing
  # engine/architecture suite keeps running unchanged and unpromoted.
  early-evidence:
    needs: [changes, images, helm-lint]
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.helm == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # check-test-evidence.py requires a real commit SHA; the `-amd64` image
      # tag (and a `v*` tag build's IMAGE_TAG) can never stand in for it.
      CANDIDATE_SHA: ${{ github.sha }}
      CAESIUM_SKIP_IMAGE_BUILD: "true"
    steps:
      - uses: actions/checkout@v6
      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x ./kubectl
          sudo mv ./kubectl /usr/local/bin/kubectl
      - uses: azure/setup-helm@v5
        with:
          version: v3.17.0
      # Loads the precompiled runner, product and robustness images (no
      # compiler image) and runs the focused SQL-work-budget scenario.
      - name: SQL-work budget scenario (existing integration suite)
        uses: ./.github/actions/run-integration
        with:
          arch: amd64
          recipe: integration-test-sql-budget
          load-robustness: "true"
      - name: Three-node owner-crash lane
        run: just tag=${{ env.IMAGE_TAG }}-amd64 robustness-test
      - name: Validate scenario evidence
        run: just tag=${{ env.IMAGE_TAG }}-amd64 check-evidence
      - name: Upload scenario evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: early-evidence
          # The lane redacts its generated internal token and kubeconfigs
          # before this step; see `just robustness-test`.
          path: .tmp/evidence/
          if-no-files-found: error
          retention-days: 7

  podman-integration-test:
    needs: [changes, images]
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.ci == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/load-docker-images
        with:
          name: product-amd64
      - uses: ./.github/actions/load-docker-images
        with:
          name: integration-runner-amd64
      - name: Enable Podman socket
        run: |
          systemctl --user enable --now podman.socket
          podman info
      - name: Pre-pull job images via Podman
        run: podman pull alpine:3.23
      - name: Start Caesium with Podman engine
        # This lane starts its OWN server rather than going through
        # `just integration-up`, so it silently drifts red whenever a feature
        # adds env there and not here. Keep this block a superset of
        # `integration-up`'s `-e` flags (justfile) plus the podman-only ones.
        run: |
          PODMAN_SOCK="/run/user/$(id -u)/podman/podman.sock"
          docker run -d --name caesium-server-podman \
            -p 8080:8080 \
            -v "${PODMAN_SOCK}:/run/podman/podman.sock" \
            -e CAESIUM_PODMAN_URI=unix:///run/podman/podman.sock \
            -e CAESIUM_MANUAL_TRIGGER_API_KEY=integration-test-key \
            -e CAESIUM_EVENT_INGEST_API_KEY=integration-test-key \
            -e CAESIUM_RUN_QUEUE_ENABLED=true \
            -e CAESIUM_RUN_QUEUE_DEQUEUER_ENABLED=true \
            -e CAESIUM_RUN_QUEUE_DEQUEUE_INTERVAL=500ms \
            -e CAESIUM_RATE_LIMIT_PRUNER_ENABLED=true \
            -e CAESIUM_RATE_LIMIT_PRUNE_INTERVAL=500ms \
            -e CAESIUM_NOTIFICATION_WATCHER_INTERVAL=1s \
            -e CAESIUM_LOG_LEVEL=debug \
            -e CAESIUM_OPEN_LINEAGE_ENABLED=true \
            -e CAESIUM_OPEN_LINEAGE_TRANSPORT=console \
            -e CAESIUM_FRESHNESS_ENABLED=true \
            -e CAESIUM_DATA_ASSERTIONS_ENABLED=true \
            -e CAESIUM_CONTRACT_ENFORCEMENT=fail \
            -e CAESIUM_CONTRACT_DEPRECATION_WINDOW=5s \
            -e CAESIUM_CACHE_PIN_DIGESTS=true \
            -e CAESIUM_CACHE_ENABLED=true \
            -e CAESIUM_REGISTRY_AUTH=127.0.0.1=secret://env/CAESIUM_IT_REGISTRY_CREDS \
            -e CAESIUM_IT_REGISTRY_CREDS=ci-user:ci-pass \
            -e CAESIUM_DATABASE_SHARDS=4 \
            -e CAESIUM_FANOUT_MAX_PARTITIONS=8 \
            --user 0:0 \
            caesiumcloud/caesium:${{ env.IMAGE_TAG }}-amd64 start
      - name: Extract caesium CLI
        run: |
          mkdir -p .tmp/caesium-cli
          ctr=$(docker create caesiumcloud/caesium:${{ env.IMAGE_TAG }}-amd64)
          docker cp "$ctr":/bin/caesium .tmp/caesium-cli/caesium
          docker rm -f "$ctr"
          chmod +x .tmp/caesium-cli/caesium
      - name: Full integration suite (Podman, shard ${{ matrix.shard }}/3)
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$(pwd)":/bld/caesium \
            -e CAESIUM_TEST_SHARD_INDEX=${{ matrix.shard }} \
            -e CAESIUM_TEST_SHARD_COUNT=3 \
            -e CAESIUM_TEST_ENGINE=podman \
            -e CAESIUM_CLI_PATH=/bld/caesium/.tmp/caesium-cli/caesium \
            --network=container:caesium-server-podman \
            -w /bld/caesium \
            caesiumcloud/caesium-integration:${{ env.IMAGE_TAG }}-amd64 \
            sh scripts/integration-test.sh
      - name: Dump Caesium logs on failure
        if: failure()
        run: docker logs caesium-server-podman || true
      - name: Cleanup
        if: always()
        run: docker rm -f caesium-server-podman || true

  build-and-integration-test:
    if: always()
    needs: [changes, images, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Verify required integration matrix
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci-ok.py changes images integration

  build-and-integration-test-agent-auth:
    if: always()
    needs: [changes, images, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Verify required integration matrix
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci-ok.py changes images integration

  # Merge gate. Failure/cancelled of any listed job fails the gate; skipped
  # (path filter) is allowed. Include image producers so a failed `images`
  # job cannot hide behind skipped integration consumers.
  #
  # `early-evidence` is required here (distributed-testing G5) and a green job
  # result alone does not satisfy it: the gate downloads the report that lane
  # uploaded and re-validates it against the committed scenario manifest, bound
  # to this run's candidate SHA. Absent, foreign or hollow evidence fails.
  #
  # NOTE: `ci-ok` is not itself one of master's required status checks (they are
  # lint, unit-test, unit-test-arm64, ui-test, ui-e2e, ui-e2e-auth,
  # build-and-integration-test and build-and-integration-test-agent-auth). This
  # job gates `publish`; making it gate PR merge is a repository-settings change
  # for the CODEOWNER, not a workflow change.
  #
  # distributed-testing G7: the gate also carries this run's full candidate
  # identity (event, tested SHA, base/head SHA) and a base-freshness check.
  # `scripts/ci-ok.py` refuses missing/malformed identity and, on merge_group
  # only, a base SHA that no longer matches master's current tip -- see its
  # module docstring and the Q6 record in
  # docs/exec-plans/active/distributed-testing.md.
  ci-ok:
    if: always()
    needs:
      - changes
      - ci-config
      - builder
      - builder-arm64
      - images
      - images-arm64
      - reagents
      - lint
      - unit-test
      - unit-test-arm64
      - ui-test
      - ui-e2e
      - ui-e2e-auth
      - integration
      - helm-lint
      - early-evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      # Only downloadable when the lane actually ran. A lane that ran but left
      # no report still fails the gate: ci-ok.py requires the file.
      - name: Download early-evidence report
        if: needs.early-evidence.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: early-evidence
          path: .tmp/evidence
      # Q6/G7 staleness input: master's actual tip at evaluation time, read
      # fresh rather than trusted from any earlier step. A transient failure
      # here must not hard-fail the job -- ci-ok.py's own fail-closed logic
      # decides what an empty result means per event (informational on
      # pull_request, a hard failure on merge_group).
      - name: Determine current master tip (base freshness)
        id: base-freshness
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        continue-on-error: true
        run: |
          sha="$(git ls-remote origin refs/heads/master | cut -f1)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      # Q6/G7: on pull_request, github.sha is a synthetic merge of base+head
      # (refs/pull/N/merge) -- read its REAL parents rather than trusting the
      # event payload's base.sha/head.sha at face value. `git cat-file -p`
      # reads them straight out of the commit object, which is unaffected by
      # the default fetch-depth 1 checkout above: a shallow fetch omits the
      # parent COMMITS, never the parent SHAs recorded in the fetched
      # commit's own header. A transient failure here must not hard-fail the
      # job -- scripts/ci-ok.py's own verify_pull_request_candidate_parents
      # refuses closed on anything other than exactly two parents.
      - name: Read pull_request candidate merge-commit parents
        id: candidate-parents
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          parents="$(git cat-file -p "${{ github.sha }}" | awk '$1 == "parent" { print $2 }' | tr '\n' ' ')"
          echo "parents=$parents" >> "$GITHUB_OUTPUT"
      - name: Evaluate merge gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 scripts/ci-ok.py \
            --evidence-report .tmp/evidence/evidence.json \
            --evidence-manifest test/contracts/scenarios.json \
            --candidate-sha "${{ github.sha }}" \
            --event-name "${{ github.event_name }}" \
            --base-sha "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event_name == 'merge_group' && github.event.merge_group.base_sha) || '' }}" \
            --head-sha "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'merge_group' && github.event.merge_group.head_sha) || '' }}" \
            --current-base-sha "${{ steps.base-freshness.outputs.sha }}" \
            --candidate-parents "${{ steps.candidate-parents.outputs.parents }}" \
            changes \
            ci-config \
            builder \
            builder-arm64 \
            images \
            images-arm64 \
            reagents \
            lint \
            unit-test \
            unit-test-arm64 \
            ui-test \
            ui-e2e \
            ui-e2e-auth \
            integration \
            helm-lint \
            early-evidence

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - ci-ok
      - lint
      - unit-test
      - unit-test-arm64
      - ui-test
      - ui-e2e
      - ui-e2e-auth
      - images
      - images-arm64
      - reagents
      - reagents-arm64
      - integration
      - integration-extra
      - integration-arm64
      - helm-lint
      - helm-integration-test
      - helm-pod-replacement-test
      - podman-integration-test
    runs-on: ubuntu-24.04
    environment: Docker
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Verify chart appVersion matches the pushed tag
        run: |
          grep -q "^appVersion: \"${GITHUB_REF_NAME}\"$" helm/caesium/Chart.yaml || {
            echo "helm/caesium/Chart.yaml appVersion does not equal the pushed tag ${GITHUB_REF_NAME}:"
            grep '^appVersion:' helm/caesium/Chart.yaml
            echo "Every v* tag bumps Chart.yaml appVersion to the tag (and version per semver) in the same PR."
            exit 1
          }
      - uses: ./.github/actions/load-docker-images
        with:
          name: product-amd64
      - uses: ./.github/actions/load-docker-images
        with:
          name: product-arm64
      - uses: ./.github/actions/load-docker-images
        with:
          name: reagents-amd64
      - uses: ./.github/actions/load-docker-images
        with:
          name: reagents-arm64
      - uses: actions/download-artifact@v8
        with:
          name: release-cli-amd64
          path: /tmp/cli
      - uses: actions/download-artifact@v8
        with:
          name: release-cli-arm64
          path: /tmp/cli
      - name: Verify CLI smoke markers and checksums
        run: |
          set -euo pipefail
          cd /tmp/cli
          for arch in amd64 arm64; do
            bin="caesium-linux-${arch}"
            marker="${bin}.smoke-ok"
            test -f "$bin" || { echo "missing $bin"; exit 1; }
            test -f "$marker" || {
              echo "missing $marker - the $arch build job did not smoke-test its binary"
              exit 1
            }
            expected="$(sed -n 's/^sha256=//p' "$marker")"
            actual="$(sha256sum "$bin" | awk '{print $1}')"
            if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
              echo "sha256 mismatch for $bin: marker='$expected' actual='$actual'"
              exit 1
            fi
            echo "verified $bin ($actual)"
            cat "$marker"
          done
          sha256sum caesium-linux-amd64 caesium-linux-arm64 > SHA256SUMS
          cat SHA256SUMS
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      - name: Push multi-arch manifest
        run: |
          IMAGE_TAG=${{ env.IMAGE_TAG }}
          docker push caesiumcloud/caesium:${IMAGE_TAG}-amd64
          docker push caesiumcloud/caesium:${IMAGE_TAG}-arm64
          docker manifest create caesiumcloud/caesium:${IMAGE_TAG} \
            caesiumcloud/caesium:${IMAGE_TAG}-amd64 \
            caesiumcloud/caesium:${IMAGE_TAG}-arm64
          docker manifest push caesiumcloud/caesium:${IMAGE_TAG}
      - name: Push reagent multi-arch manifests
        run: |
          IMAGE_TAG=${{ env.IMAGE_TAG }}
          for role in git-source tf-discover tf-warm tf-runner; do
            docker push caesiumcloud/$role:${IMAGE_TAG}-amd64
            docker push caesiumcloud/$role:${IMAGE_TAG}-arm64
            docker manifest create caesiumcloud/$role:${IMAGE_TAG} \
              caesiumcloud/$role:${IMAGE_TAG}-amd64 \
              caesiumcloud/$role:${IMAGE_TAG}-arm64
            docker manifest push caesiumcloud/$role:${IMAGE_TAG}
          done
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IMAGE_TAG=${{ env.IMAGE_TAG }}
          amd64_digest="$(docker inspect --format '{{index .RepoDigests 0}}' caesiumcloud/caesium:${IMAGE_TAG}-amd64)"
          arm64_digest="$(docker inspect --format '{{index .RepoDigests 0}}' caesiumcloud/caesium:${IMAGE_TAG}-arm64)"
          cat > /tmp/release-notes.md <<EOF
          ## Install

          ### CLI binary (Linux only)

          \`caesium-linux-amd64\` and \`caesium-linux-arm64\` are **statically
          linked** executables: they need no shared libraries and run on any
          Linux host of the matching architecture. Verify against
          \`SHA256SUMS\`, then:

          \`\`\`sh
          curl -fsSLo caesium https://github.com/${GITHUB_REPOSITORY}/releases/download/${IMAGE_TAG}/caesium-linux-\$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          chmod +x caesium && sudo mv caesium /usr/local/bin/caesium
          caesium --help
          \`\`\`

          There is **no macOS or Windows binary**: the toolchain builds
          \`GOOS=linux\` against a CGO dqlite. On macOS run the CLI through the
          container image instead — \`just tag=${IMAGE_TAG} cli\` writes a
          wrapper to \`./.tmp/caesium-cli/caesium\`.

          Each binary was smoke-tested **natively on its own architecture's
          runner** (\`ubuntu-24.04\` / \`ubuntu-24.04-arm\`, no emulation) inside
          a plain \`ubuntu:24.04\` container carrying none of the caesium
          runtime libraries: \`caesium --help\` and \`caesium job lint\` both
          succeed there.

          ### Container image

          \`\`\`sh
          docker pull caesiumcloud/caesium:${IMAGE_TAG}
          \`\`\`

          | Platform | Digest |
          |---|---|
          | linux/amd64 | \`${amd64_digest}\` |
          | linux/arm64 | \`${arm64_digest}\` |

          ### Helm

          \`helm/caesium\` \`appVersion\` is pinned to \`${IMAGE_TAG}\`, so an
          un-overridden \`helm install caesium ./helm/caesium\` deploys this
          release.
          EOF
          assets=(/tmp/cli/caesium-linux-amd64 /tmp/cli/caesium-linux-arm64 /tmp/cli/SHA256SUMS)
          if gh release view "${IMAGE_TAG}" >/dev/null 2>&1; then
            echo "release ${IMAGE_TAG} already exists; re-uploading assets with --clobber"
            gh release upload "${IMAGE_TAG}" --clobber "${assets[@]}"
          else
            gh release create "${IMAGE_TAG}" \
              --verify-tag \
              --title "${IMAGE_TAG}" \
              --notes-file /tmp/release-notes.md \
              "${assets[@]}"
          fi
