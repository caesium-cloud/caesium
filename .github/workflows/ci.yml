  helm-integration-test:
    needs: [changes, images, helm-lint]
    if: needs.changes.outputs.helm == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.ci == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/load-docker-images
        with:
          name: product-amd64
      - uses: ./.github/actions/load-docker-images
        with:
          name: integration-runner-amd64
      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x ./kubectl
          sudo mv ./kubectl /usr/local/bin/kubectl
      - uses: azure/setup-helm@v5
        with:
          version: v3.17.0
      - name: Create kind cluster
        run: kind create cluster --wait 120s
      - name: Load Caesium image into kind
        run: kind load docker-image caesiumcloud/caesium:${{ env.IMAGE_TAG }}-amd64
      - name: Helm install
        run: |
          if ! helm install caesium ./helm/caesium \
            --values ./helm/caesium/ci/test-values-k8s.yaml \
            --set image.tag=${{ env.IMAGE_TAG }}-amd64 \
            --wait --timeout 240s; then
            kubectl get pods -A || true
            kubectl get events --sort-by=.lastTimestamp -A | tail -n 200 || true
            kubectl describe statefulset caesium || true
            kubectl describe pods -l app.kubernetes.io/instance=caesium || true
            kubectl logs statefulset/caesium -c caesium || true
            kubectl logs statefulset/caesium -c peer-discovery || true
            exit 1
          fi
      - name: Helm test
        run: helm test caesium --timeout 90s
      - name: Pre-load job images into kind
        run: |
          docker pull alpine:3.23
          kind load docker-image alpine:3.23
          kind load docker-image caesiumcloud/resource-stress:${{ env.IMAGE_TAG }}-amd64
      - name: Start port-forward to Caesium
        run: |
          kubectl port-forward service/caesium 8080:8080 >/tmp/port-forward.log 2>&1 &
          echo $! > /tmp/port-forward.pid

          tries=0
          until curl -sf http://127.0.0.1:8080/health >/dev/null; do
            tries=$((tries + 1))
            if [ "$tries" -gt 30 ]; then
              echo "Port-forward did not become ready in time"
              cat /tmp/port-forward.log || true
              kubectl get pods -A || true
              exit 1
            fi
            sleep 1
          done
      - name: Extract caesium CLI
        run: |
          mkdir -p .tmp/caesium-cli
          ctr=$(docker create caesiumcloud/caesium:${{ env.IMAGE_TAG }}-amd64)
          docker cp "$ctr":/bin/caesium .tmp/caesium-cli/caesium
          docker rm -f "$ctr"
          chmod +x .tmp/caesium-cli/caesium
      - name: Full integration suite (Kubernetes, shard ${{ matrix.shard }}/3)
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$(pwd)":/bld/caesium \
            -e CAESIUM_TEST_SHARD_INDEX=${{ matrix.shard }} \
            -e CAESIUM_TEST_SHARD_COUNT=3 \
            -e CAESIUM_TEST_ENGINE=kubernetes \
            -e CAESIUM_RESOURCE_STRESS_IMAGE=caesiumcloud/resource-stress:${{ env.IMAGE_TAG }}-amd64 \
            -e CAESIUM_CLI_PATH=/bld/caesium/.tmp/caesium-cli/caesium \
            --network=host \
            -w /bld/caesium \
            caesiumcloud/caesium-integration:${{ env.IMAGE_TAG }}-amd64 \
            sh scripts/integration-test.sh
      - name: Download static host CLI for cache identity regression
        if: matrix.shard == 1
        uses: actions/download-artifact@v8
        with:
          name: release-cli-amd64
          path: .tmp/cache-identity-cli
      - name: Kubernetes mutable-tag cache identity (local and distributed)
        if: matrix.shard == 1
        run: |
          set -euo pipefail
          mkdir -p .tmp/kubernetes-cache-identity
          chmod +x .tmp/cache-identity-cli/caesium-linux-amd64
          python3 test/kubernetes_cache_identity.py --cli .tmp/cache-identity-cli/caesium-linux-amd64 --mode local 2>&1 | tee .tmp/kubernetes-cache-identity/local.log
          kill "$(cat /tmp/port-forward.pid)" 2>/dev/null || true
          kubectl set env statefulset/caesium CAESIUM_EXECUTION_MODE=distributed
          kubectl rollout status statefulset/caesium --timeout=240s
          kubectl port-forward service/caesium 8080:8080 >/tmp/port-forward.log 2>&1 &
          echo $! > /tmp/port-forward.pid
          ready=false
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/health >/dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/port-forward.log; exit 1; fi
          python3 test/kubernetes_cache_identity.py --cli .tmp/cache-identity-cli/caesium-linux-amd64 --mode distributed 2>&1 | tee .tmp/kubernetes-cache-identity/distributed.log
      - name: Record Kubernetes cache identity scenarios that could not run
        if: always() && matrix.shard == 1
        run: |
          mkdir -p .tmp/kubernetes-cache-identity
          for mode in local distributed; do
            evidence=".tmp/kubernetes-cache-identity/$mode.log"
            if [ ! -f "$evidence" ]; then
              printf '{"result":"not_run","mode":"%s","reason":"scenario did not run; inspect prerequisite or earlier mode failure"}\n' "$mode" > "$evidence"
            fi
          done
      - name: Retain Kubernetes cache identity evidence
        if: always() && matrix.shard == 1
        uses: actions/upload-artifact@v7
        with:
          name: kubernetes-cache-identity
          path: .tmp/kubernetes-cache-identity/
          if-no-files-found: error
      - name: Distributed Kubernetes deadline regression
        if: matrix.shard == 1
        run: |
          set -euo pipefail
          # The complete three-shard suite above stays local, and the cache
          # identity controls run before these deadline-specific distributed settings.
          kill "$(cat /tmp/port-forward.pid)" 2>/dev/null || true
          kubectl set env statefulset/caesium --containers=caesium \
            CAESIUM_EXECUTION_MODE=distributed \
            CAESIUM_RUN_OWNER_ENABLED=true \
            CAESIUM_WORKER_ENABLED=true \
            CAESIUM_INTERNAL_WAKEUP_TOKEN=integration-distributed-internal-token \
            CAESIUM_INTERNAL_PORT=8443 \
            CAESIUM_RUN_LEASE_TTL=30s \
            CAESIUM_RUN_OWNER_DISPATCH_INTERVAL=500ms \
            CAESIUM_RUN_OWNER_DISPATCH_DEADLINE=5m \
            CAESIUM_WORKER_POOL_SIZE=1 \
            CAESIUM_WORKER_POLL_INTERVAL=500ms \
            CAESIUM_WORKER_RECLAIM_INTERVAL=500ms \
            CAESIUM_WORKER_LEASE_TTL=30s
          # Preserve the chart's POD_IP-based database/node address.
          kubectl rollout status statefulset/caesium --timeout=240s
          kubectl port-forward service/caesium 8080:8080 >/tmp/port-forward.log 2>&1 &
          echo $! > /tmp/port-forward.pid
          ready=false
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/health >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat /tmp/port-forward.log
            exit 1
          fi

          mkdir -p .tmp
          kind get kubeconfig > .tmp/deadline-kubeconfig
          chmod 600 .tmp/deadline-kubeconfig
          # kind may list its IPv6 subnet first, or omit that subnet's gateway.
          # The witness listens on IPv4, so select a matching gateway explicitly.
          network_config=$(docker network inspect kind --format '{{json .IPAM.Config}}')
          witness_host=$(python3 -c '
          import ipaddress, json, sys
          for config in json.load(sys.stdin):
              gateway = config.get("Gateway")
              if gateway and ipaddress.ip_address(gateway).version == 4:
                  print(gateway)
                  break
          ' <<< "$network_config")
          if [ -z "$witness_host" ]; then
            echo "kind network has no IPv4 gateway for the deadline witness: $network_config" >&2
            exit 1
          fi
          echo "Kubernetes deadline witness gateway: $witness_host"
          deadline_log=.tmp/distributed-kubernetes-deadlines.log
          docker run --rm \
            -v "$(pwd)":/bld/caesium \
            -v "$(pwd)/.tmp/deadline-kubeconfig":/tmp/deadline-kubeconfig:ro \
            -e KUBECONFIG=/tmp/deadline-kubeconfig \
            -e CAESIUM_TEST_WITNESS_HOST="$witness_host" \
            -e CAESIUM_TEST_ENGINE=kubernetes \
            -e CAESIUM_EXECUTION_MODE=distributed \
            -e CAESIUM_CLI_PATH=/bld/caesium/.tmp/caesium-cli/caesium \
            --network=host \
            -w /bld/caesium \
            caesiumcloud/caesium-integration:${{ env.IMAGE_TAG }}-amd64 \
            sh scripts/integration-test.sh \
              -test.run '^TestIntegrationTestSuite$' \
              -testify.m '^TestDistributedKubernetesDeadlines$' | tee "$deadline_log"
          # A missing method or skipped subcase must not report green coverage.
          if ! grep -Eq -- '--- PASS: TestIntegrationTestSuite/TestDistributedKubernetesDeadlines \(' "$deadline_log"; then
            echo "Distributed Kubernetes deadline scenario did not pass" >&2
            exit 1
          fi
          if grep -Eq -- '--- SKIP: TestIntegrationTestSuite/TestDistributedKubernetesDeadlines' "$deadline_log"; then
            echo "Distributed Kubernetes deadline scenario skipped required coverage" >&2
            exit 1
          fi
      - name: Stop port-forward
        if: always()
        run: kill "$(cat /tmp/port-forward.pid)" 2>/dev/null || true
      - name: Dump logs on failure
        if: failure()
        run: |
          kubectl logs statefulset/caesium -c caesium || true
          kubectl get pods -A || true
          kubectl describe pods -l cloud.caesium -A || true

  # Issue #493: an ordinary StatefulSet pod replacement hands the pod a new IP
  # while its PVC — and the dqlite address recorded inside it — survives. This
  # lane replaces all three replicas in turn on retained volumes, fails unless
  # the pod IP actually changed, and asserts the member rejoins the dqlite
  # cluster at its new address with prior runs readable and new jobs executing.
  # The other Helm lanes cannot catch this: they run one replica with
  # persistence disabled, so every boot writes a fresh info.yaml.
  helm-pod-replacement-test:
    needs: [changes, images, helm-lint]
    if: needs.changes.outputs.helm == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/load-docker-images
        with:
          name: product-amd64
      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x ./kubectl
          sudo mv ./kubectl /usr/local/bin/kubectl
      - uses: azure/setup-helm@v5
        with:
          version: v3.17.0
      - name: Pre-pull the task image
        run: docker pull alpine:3.23
      - name: Replace every replica on retained volumes
        env:
          CAESIUM_REPLACEMENT_ID: rp-${{ github.run_id }}
          CAESIUM_REPLACEMENT_ARTIFACTS: ${{ github.workspace }}/.tmp/pod-replacement
          CAESIUM_REPLACEMENT_IMAGE: caesiumcloud/caesium:${{ env.IMAGE_TAG }}-amd64
          CAESIUM_REPLACEMENT_KIND_IMAGE: kindest/node:v1.36.1
          CAESIUM_REPLACEMENT_TASK_IMAGE: alpine:3.23
        run: bash scripts/helm-pod-replacement.sh
      - name: Upload pod-replacement artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: helm-pod-replacement
          path: .tmp/pod-replacement/
          if-no-files-found: warn
          retention-days: 7

  # First persistent three-node robustness lane: B1's owner-crash regression on
  # kind + the Helm StatefulSet, plus E5's SQL-work budget on the existing
  # Docker integration server. Both reduce to one scenario evidence report that
  # scripts/check-test-evidence.py validates against test/contracts/scenarios.json,
  # failing closed on a missing artifact or scenario, an unexpected skip, a
  # disabled gate, wrong topology/mode/flags, a wrong candidate identity or
  # absent fault-activation evidence.
  #
  # PROMOTED (distributed-testing G5): this lane is part of the fail-closed
  # `ci-ok` aggregate, which also gates `publish`. Since 2026-09-28 (W8, Q6)
  # `ci-ok` is a required status check and the merge queue's condition, so the
  # promotion blocks PR merge. Every existing engine/architecture suite keeps
  # running unchanged and unpromoted.
  early-evidence:
    needs: [changes, images, helm-lint]
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.helm == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # check-test-evidence.py requires a real commit SHA; the `-amd64` image
      # tag (and a `v*` tag build's IMAGE_TAG) can never stand in for it.
      CANDIDATE_SHA: ${{ github.sha }}
      CAESIUM_SKIP_IMAGE_BUILD: "true"
    steps:
      - uses: actions/checkout@v6
      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x ./kubectl
          sudo mv ./kubectl /usr/local/bin/kubectl
      - uses: azure/setup-helm@v5
        with:
          version: v3.17.0
      # Loads the precompiled runner, product and robustness images (no
      # compiler image) and runs the focused SQL-work-budget scenario.
      - name: SQL-work budget scenario (existing integration suite)
        uses: ./.github/actions/run-integration
        with:
          arch: amd64
          recipe: integration-test-sql-budget
          load-robustness: "true"
      - name: Three-node owner-crash lane
        run: just tag=${{ env.IMAGE_TAG }}-amd64 robustness-test
      - name: Validate scenario evidence
        run: just tag=${{ env.IMAGE_TAG }}-amd64 check-evidence
      - name: Redact robustness evidence before upload
        id: redact_robustness_evidence
        if: always()
        run: |
          if [[ -e .tmp/evidence/robustness || -L .tmp/evidence/robustness ]]; then
            python3 scripts/collect-evidence.py redact --artifacts .tmp/evidence/robustness
          else
            echo "No robustness artifact directory was produced; no robustness logs to redact."
          fi
      - name: Upload scenario evidence
        if: always() && steps.redact_robustness_evidence.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: early-evidence
          # A failed lane may upload diagnostics only after mandatory redaction.
          path: .tmp/evidence/
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # distributed-testing G6: the remaining complete system suites, each as its
  # own job off the existing image artifacts, in parallel with early-evidence.
  # Every lane reduces its artifacts to a scenario report with
  # scripts/collect-lane-evidence.py and validates it against the committed
  # manifest under its own gate inside the job; `ci-ok` then downloads that
  # report and re-validates it against this run's candidate SHA, exactly as it
  # does for early-evidence. A green job without a report fails the gate.
  # ---------------------------------------------------------------------------

  # F4 single-node v0.1.0 -> candidate upgrade qualification. The candidate is
  # the release image `images` built from this commit; its producer-recorded
  # image id binds the (explicitly overridden, recorded) supplied image.
  lifecycle-standalone:
    needs: [changes, builder, images]
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CANDIDATE_SHA: ${{ github.sha }}
      CAESIUM_SKIP_IMAGE_BUILD: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@just
      - uses: ./.github/actions/load-docker-images
        with:
          name: builder-amd64
      - uses: ./.github/actions/load-docker-images
        with:
          name: product-amd64
      - uses: actions/download-artifact@v8
        with:
          name: image-ids-amd64
          path: .tmp/image-ids
      - name: Single-node upgrade qualification
        run: |
          set -euo pipefail
          expected="$(cat .tmp/image-ids/release.txt)"
          CAESIUM_LIFECYCLE_CANDIDATE_IMAGE="caesiumcloud/caesium:${{ env.IMAGE_TAG }}-amd64" \
          CAESIUM_LIFECYCLE_ALLOW_UNVERIFIED_IMAGE=1 \
          CAESIUM_LIFECYCLE_EXPECTED_IMAGE_ID="$expected" \
          CAESIUM_LIFECYCLE_BUILDER_IMAGE="caesiumcloud/caesium-builder:${{ env.IMAGE_TAG }}-amd64" \
            just tag=${{ env.IMAGE_TAG }}-amd64 lifecycle-standalone
      - name: Upload lane report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lifecycle-standalone-evidence
          path: .tmp/lane-evidence/lifecycle-standalone/*.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload lane artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lifecycle-standalone-artifacts
          path: |
            .tmp/lane-evidence/lifecycle-standalone/
            !.tmp/lane-evidence/lifecycle-standalone/artifacts/lifecycle.test
            !.tmp/lane-evidence/lifecycle-standalone/artifacts/cli/
          if-no-files-found: warn
          retention-days: 7

  # C2 native fuzzing in short mode plus the -race renewal repeat matrix.
  generated-fuzz:
    needs: [changes, builder]
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CANDIDATE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@just
      - uses: ./.github/actions/load-docker-images
        with:
          name: builder-amd64
      # Go build and fuzz cache between runs: a cold cache spends most of the
      # lane compiling (race and fuzz-instrumented builds). Content-addressed,
      # so it can only miss; keyed on the dependency set and the fuzz script.
      - name: Restore the Go fuzz build cache
        uses: actions/cache@v4
        with:
          path: .tmp/fuzz-gocache
          key: fuzz-gocache-v1-amd64-${{ hashFiles('go.sum', 'build/Dockerfile.build', 'scripts/fuzz-tests.sh') }}
          restore-keys: |
            fuzz-gocache-v1-amd64-
      - name: Native fuzz targets (short mode)
        run: CAESIUM_FUZZ_GOCACHE="$PWD/.tmp/fuzz-gocache" just tag=${{ env.IMAGE_TAG }}-amd64 generated-fuzz
      - name: Upload lane report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generated-fuzz-evidence
          path: .tmp/lane-evidence/generated-fuzz/*.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload lane artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generated-fuzz-artifacts
          path: .tmp/lane-evidence/generated-fuzz/
          if-no-files-found: warn
          retention-days: 7

  # C3 checker-strength validator: eight known-bad mutations in an isolated
  # clone must each be rejected by their named test.
  generated-oracles:
    needs: [changes, builder]
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CANDIDATE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@just
      - uses: ./.github/actions/load-docker-images
        with:
          name: builder-amd64
      - name: Mutation validator
        run: just tag=${{ env.IMAGE_TAG }}-amd64 generated-oracles
      - name: Upload lane report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generated-oracles-evidence
          path: .tmp/lane-evidence/generated-oracles/*.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload lane artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generated-oracles-artifacts
          path: .tmp/lane-evidence/generated-oracles/
          if-no-files-found: warn
          retention-days: 7

  # G2 coverage-instrumented CLI/server/browser collection against the
  # committed ratchets. The diff floor needs the tested change's real Go paths:
  # the base is the event's own (pull_request base / merge_group base / push
  # before), fetched explicitly because the checkout is shallow.
  coverage-ratchets:
    needs: [changes, builder]
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.ui == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CANDIDATE_SHA: ${{ github.sha }}
      CAESIUM_SKIP_IMAGE_BUILD: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@just
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install Chromium for the browser journey
        working-directory: ui
        run: |
          npm ci --prefer-offline
          npx playwright install --with-deps chromium
      # scripts/integration-coverage.sh pins the builder as `name@<image id>`
      # for Docker FROM. That reference resolves locally only where an image id
      # is a content digest (the containerd image store) AND the engine's
      # BuildKit resolves a local digest reference (Docker Desktop's engine
      # does; the hosted image's 28.0.4 goes to the registry instead). Upgrade
      # the engine from Docker's own apt repository and switch the store before
      # anything is loaded, rather than weaken the script's immutable pin.
      - name: Docker engine with the containerd image store
        run: |
          set -euo pipefail
          need=29.0
          have="$(docker version --format '{{.Server.Version}}')"
          echo "docker server $have"
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -1)" != "$need" ]; then
            sudo install -m 0755 -d /etc/apt/keyrings
            sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
            sudo chmod a+r /etc/apt/keyrings/docker.asc
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" \
              | sudo tee /etc/apt/sources.list.d/docker.list >/dev/null
            sudo apt-get update -q
            sudo apt-get install -y -q docker-ce docker-ce-cli containerd.io docker-buildx-plugin
          fi
          conf=/etc/docker/daemon.json
          if [ -s "$conf" ]; then current="$(sudo cat "$conf")"; else current='{}'; fi
          printf '%s' "$current" | jq '.features["containerd-snapshotter"] = true' | sudo tee "$conf" >/dev/null
          sudo systemctl restart docker
          docker version --format 'docker client {{.Client.Version}} server {{.Server.Version}}'
          docker info --format '{{json .DriverStatus}}'
      - uses: ./.github/actions/load-docker-images
        with:
          name: builder-amd64
      - name: Changed Go paths of the tested change
        env:
          DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          mkdir -p .tmp/coverage-diff
          base="${DIFF_BASE_SHA:-}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=2 origin "${{ github.sha }}"
            base="$(git rev-parse "${{ github.sha }}^")"
          else
            git fetch --no-tags --depth=1 origin "$base"
          fi
          git diff --name-only --diff-filter=ACMR "$base" "${{ github.sha }}" -- '*.go' >.tmp/coverage-diff/changed-paths.txt
          echo "diff base $base; $(wc -l <.tmp/coverage-diff/changed-paths.txt) changed Go path(s)"
          echo "CAESIUM_COVERAGE_DIFF_BASE=$base" >>"$GITHUB_ENV"
          echo "CAESIUM_COVERAGE_CHANGED_PATHS=$PWD/.tmp/coverage-diff/changed-paths.txt" >>"$GITHUB_ENV"
      - name: Backend journey tools
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/coverage-tools"
          mkdir -p "$tools"
          curl -fsSL https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64 -o "$tools/kind"
          echo "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  $tools/kind" | sha256sum -c -
          curl -fsSL https://dl.k8s.io/release/v1.36.1/bin/linux/amd64/kubectl -o "$tools/kubectl"
          echo "629d3f410e09bf49b64ae7079f7f0bda1191efed311f7d37fdbab0ad5b0ec2b7  $tools/kubectl" | sha256sum -c -
          chmod +x "$tools/kind" "$tools/kubectl"
          echo "$tools" >>"$GITHUB_PATH"
      - name: Pin isolated backend prerequisites
        run: |
          set -euo pipefail
          prereqs="$PWD/.tmp/coverage-backends"
          mkdir -p "$prereqs"
          podman_image=quay.io/podman/stable@sha256:c2c2b4fe8164af561d4804475c15f16c37ec1e40189e5330e7609f307d944dcd
          docker pull --platform linux/amd64 "$podman_image"
          docker pull --platform linux/amd64 kindest/node:v1.36.1
          docker pull --platform linux/amd64 alpine:3.23
          python3 - "$prereqs" "$podman_image" <<'PY'
          import hashlib, json, pathlib, re, runpy, shutil, subprocess, sys, tarfile
          root = pathlib.Path(sys.argv[1]).resolve()
          archive = root / 'task.tar'
          proof = root / 'proof'
          proof.mkdir()
          def image(ref):
              images = json.loads(subprocess.check_output(['docker', 'image', 'inspect', ref], text=True))
              assert len(images) == 1, 'ambiguous backend prerequisite image'
              image = images[0]
              assert image['Os'] == 'linux' and image['Architecture'] == 'amd64', 'backend prerequisite platform mismatch'
              return image
          def inspect(ref):
              return image(ref)['Id']
          def metadata(ref, expected, name):
              raw = subprocess.check_output(['docker', 'buildx', 'imagetools', 'inspect', ref, '--raw'])
              # buildx may append one CLI newline to the immutable registry bytes.
              if 'sha256:' + hashlib.sha256(raw).hexdigest() != expected and raw.endswith(b'\n'):
                  raw = raw[:-1]
              assert 'sha256:' + hashlib.sha256(raw).hexdigest() == expected, 'registry metadata digest mismatch'
              value = json.loads(raw)
              (proof / name).write_bytes(raw)
              return value
          pulled = image('alpine:3.23')
          refs = set(pulled.get('RepoDigests') or [])
          assert len(refs) == 1, 'ambiguous pulled task index'
          index_ref = refs.pop()
          assert re.fullmatch(r'(?:docker.io/library/)?alpine@sha256:[0-9a-f]{64}', index_ref), 'foreign pulled task index'
          index = metadata(index_ref, index_ref.split('@')[1], 'task-index.json')
          children = [entry for entry in index['manifests'] if entry.get('platform', {}).get('os') == 'linux'
                      and entry['platform'].get('architecture') == 'amd64' and not entry['platform'].get('variant')]
          assert len(children) == 1, 'unique exact linux/amd64 task manifest required'
          child_id = children[0]['digest']
          assert re.fullmatch(r'sha256:[0-9a-f]{64}', child_id), 'invalid task manifest digest'
          child_ref = 'alpine@' + child_id
          child = metadata(child_ref, child_id, 'task-amd64-manifest.json')
          config_id = child['config']['digest']
          assert re.fullmatch(r'sha256:[0-9a-f]{64}', config_id), 'invalid task config digest'
          assert pulled['Id'] in (index_ref.split('@')[1], child_id, config_id), 'pulled task identity differs from verified index/child/config'
          # Use the proven FROM-only BuildKit exporter rather than daemon save.
          # No RUN, --load or tag mutation: retain the exact original config.
          subprocess.check_call(['docker', 'pull', '--platform', 'linux/amd64', child_ref])
          loaded = image(child_ref)
          assert loaded['Id'] in (child_id, config_id), 'daemon task identity differs from the selected child'
          assert inspect('alpine:3.23') == pulled['Id'], 'task tag changed before export'
          source_ref = 'docker.io/library/' + child_ref
          dockerfile = 'FROM ' + source_ref + '\n'
          assert not archive.exists(), 'task export archive must be fresh'
          subprocess.run(['docker', 'buildx', 'build', '--platform', 'linux/amd64', '--network', 'none',
                          '--provenance=false', '--sbom=false', '--output', 'type=docker,dest=' + str(archive),
                          '-t', 'alpine:3.23', '-'], input=dockerfile, text=True, check=True, timeout=180)
          assert archive.stat().st_size <= 64 * 1024 * 1024, 'task export exceeds retained archive cap'
          archive_hash = hashlib.sha256(archive.read_bytes()).hexdigest()
          shutil.copyfile(archive, proof / 'task-export-original.tar')
          with tarfile.open(archive) as image_archive:
              members = image_archive.getmembers()
              assert len(members) <= 10000, 'task export member inventory exceeds cap'
              inventory = json.dumps({'archive_sha256': archive_hash, 'members': [
                  {'name': m.name, 'type': m.type.decode('ascii'), 'size': m.size, 'linkname': m.linkname}
                  for m in members]}, indent=2) + '\n'
              assert len(inventory.encode()) <= 2 * 1024 * 1024, 'task export member inventory exceeds cap'
              (proof / 'task-export-members.json').write_text(inventory)
              manifest_member = image_archive.getmember('manifest.json')
              assert manifest_member.isfile() and manifest_member.size <= 2 * 1024 * 1024, 'invalid task export manifest'
              raw_manifest = image_archive.extractfile(manifest_member).read()
              (proof / 'task-export-manifest.json').write_bytes(raw_manifest)
              manifest = json.loads(raw_manifest)
              assert len(manifest) == 1 and manifest[0]['RepoTags'] == ['alpine:3.23'], 'unexpected task archive'
              config_member = next((m for m in members if m.name == manifest[0]['Config']), None)
              assert config_member is not None and config_member.isfile(), 'exported task config member unavailable'
              assert config_member.size == child['config']['size'], 'exported config size mismatch'
              config = image_archive.extractfile(config_member).read()
              assert 'sha256:' + hashlib.sha256(config).hexdigest() == config_id, 'exported daemon config differs from selected child'
              assert len(config) == child['config']['size'], 'exported config size mismatch'
              task_config = json.loads(config)
              assert task_config['os'] == 'linux' and task_config['architecture'] == 'amd64', 'exported task platform mismatch'
          runpy.run_path('scripts/coverage-backends.py')['archive_identity'](archive, archive_hash, config_id, 'alpine:3.23', 'amd64')
          assert inspect('alpine:3.23') == pulled['Id'], 'task tag changed during export'
          (proof / 'task-export-receipt.json').write_text(json.dumps({
              'index_ref': index_ref, 'manifest_id': child_id, 'config_id': config_id,
              'docker_image_id': pulled['Id'], 'loaded_child_image_id': loaded['Id'],
              'exporter': 'buildkit-docker', 'mode': 'from-only-no-load', 'source_ref': source_ref, 'dockerfile_sha256': hashlib.sha256(dockerfile.encode()).hexdigest(),
              'platform': 'linux/amd64', 'archive_sha256': archive_hash,
              'index_metadata': 'task-index.json', 'manifest_metadata': 'task-amd64-manifest.json',
              'archive_file': 'task-export-original.tar', 'archive_members': 'task-export-members.json',
              'archive_manifest': 'task-export-manifest.json',
          }, indent=2) + '\n')
          inputs = {
              'schema_version': 1, 'platform': 'linux/amd64',
              'docker_socket': '/var/run/docker.sock',
              'task_archive': str(archive),
              'task_archive_sha256': archive_hash,
              'task_image_ref': 'alpine:3.23',
              'task_image_id': config_id,
              'task_docker_image_id': pulled['Id'],
              'kind_image_ref': 'kindest/node:v1.36.1',
              'kind_image_id': inspect('kindest/node:v1.36.1'),
              'podman_service_image_ref': sys.argv[2],
              'podman_service_image_id': inspect(sys.argv[2]),
              'podman_privileged_approved': True,
          }
          (root / 'backend-producer-inputs.json').write_text(json.dumps(inputs, indent=2) + '\n')
          PY
          echo "CAESIUM_COVERAGE_BACKEND_INPUTS=$prereqs/backend-producer-inputs.json" >>"$GITHUB_ENV"
      - name: Upload backend prerequisite proof
        if: always() && hashFiles('.tmp/coverage-backends/proof/*.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage-backend-prerequisites
          path: .tmp/coverage-backends/proof/
          if-no-files-found: error
          retention-days: 7
      - name: Coverage collection against the ratchets
        run: just tag=${{ env.IMAGE_TAG }}-amd64 coverage-ratchets
      - name: Upload lane report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-ratchets-evidence
          path: .tmp/lane-evidence/coverage-ratchets/*.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload lane artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-ratchets-artifacts
          path: .tmp/lane-evidence/coverage-ratchets/
          if-no-files-found: warn
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Qualification lanes (distributed-testing G6/G4): not merge evidence. The
  # lanes themselves live once in .github/workflows/qualification-lanes.yml;
  # this job calls them for
  #   - a `nightly=` dispatch (the named lanes; the PR matrix is deselected),
  #   - the release chain: a `v*` tag push or a `publish-dry-run` dispatch runs
  #     the release-required set on this very commit, which
  #     `release-qualification` then re-validates before `publish` can run.
  # The scheduled nightly is .github/workflows/testing-qualification.yml.
  # ---------------------------------------------------------------------------
  qualification:
    needs: [changes]
    if: inputs.nightly != '' || startsWith(github.ref, 'refs/tags/v') || inputs.publish-dry-run
    permissions:
      contents: read
    uses: ./.github/workflows/qualification-lanes.yml
    with:
      # A non-empty `nightly` names its lanes; otherwise this is the release
      # chain and runs exactly the release-required set
      # (scripts/qualification-gate.py RELEASE_LANES; test_ci.py pins it).
      lanes: ${{ inputs.nightly != '' && inputs.nightly || 'cluster-lifecycle,console-recovery,core-robustness' }}
      # Release evidence outlives the nightly window.
      retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 90 || 30 }}
      performance-mode: ${{ inputs.performance-mode || 'advisory' }}
      performance-base: ${{ inputs.performance-base || '' }}
      performance-runs: ${{ inputs.performance-runs || '[1]' }}

  podman-integration-test:
    needs: [changes, images]
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.ci == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/load-docker-images
        with:
          name: product-amd64
      - uses: ./.github/actions/load-docker-images
        with:
          name: integration-runner-amd64
      # Ubuntu 24.04's conmon 2.1.10 loses cgroup-v2 OOM notifications.
      # Keep the distro Podman API, but use the fixed upstream monitor.
      - name: Install conmon with cgroup-v2 OOM fixes
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/containers/conmon/releases/download/v2.2.1/conmon.amd64 \
            -o "${RUNNER_TEMP}/conmon"
          echo "1d97294c14c43d477e0a0826e9cd0f2a2af373ddfafe6f10252e8a3c43f32be6  ${RUNNER_TEMP}/conmon" | sha256sum --check --strict
          sudo install -m 0755 "${RUNNER_TEMP}/conmon" /usr/bin/conmon
          conmon --version
          # Upstream's static binary omits journald; use its supported file
          # driver for both the CLI smoke workload and API-created jobs.
          mkdir -p "$HOME/.config/containers"
          printf '%s\n' '[containers]' 'log_driver = "k8s-file"' > "$HOME/.config/containers/containers.conf"
      - name: Enable Podman socket
        run: |
          systemctl --user enable --now podman.socket
          podman info
      - name: Load exact stress fixture and pre-pull job images via Podman
        run: |
          set -euo pipefail
          docker save caesiumcloud/resource-stress:${{ env.IMAGE_TAG }}-amd64 | podman load
          podman image inspect caesiumcloud/resource-stress:${{ env.IMAGE_TAG }}-amd64 >/dev/null
          podman pull alpine:3.23
      - name: Verify real OOM evidence through Podman
        run: bash -x build/stress/smoke.sh podman caesiumcloud/resource-stress:${{ env.IMAGE_TAG }}-amd64
      - name: Start Caesium with Podman engine
        # This lane starts its OWN server rather than going through
        # `just integration-up`, so it silently drifts red whenever a feature
        # adds env there and not here. Keep this block a superset of
        # `integration-up`'s `-e` flags (justfile) plus the podman-only ones.
        run: |
          PODMAN_SOCK="/run/user/$(id -u)/podman/podman.sock"
          docker run -d --name caesium-server-podman \
            -p 8080:8080 \
            -v "${PODMAN_SOCK}:/run/podman/podman.sock" \
            -e CAESIUM_PODMAN_URI=unix:///run/podman/podman.sock \
            -e CAESIUM_MANUAL_TRIGGER_API_KEY=integration-test-key \
            -e CAESIUM_EVENT_INGEST_API_KEY=integration-test-key \
            -e CAESIUM_RUN_QUEUE_ENABLED=true \
            -e CAESIUM_RUN_QUEUE_DEQUEUER_ENABLED=true \
            -e CAESIUM_RUN_QUEUE_DEQUEUE_INTERVAL=500ms \
            -e CAESIUM_RATE_LIMIT_PRUNER_ENABLED=true \
            -e CAESIUM_RATE_LIMIT_PRUNE_INTERVAL=500ms \
            -e CAESIUM_NOTIFICATION_WATCHER_INTERVAL=1s \
            -e CAESIUM_LOG_LEVEL=debug \
            -e CAESIUM_OPEN_LINEAGE_ENABLED=true \
            -e CAESIUM_OPEN_LINEAGE_TRANSPORT=console \
            -e CAESIUM_FRESHNESS_ENABLED=true \
            -e CAESIUM_DATA_ASSERTIONS_ENABLED=true \
            -e CAESIUM_RESOURCE_STATS_ENABLED=true \
            -e CAESIUM_RESOURCE_STATS_SAMPLE_INTERVAL=100ms \
            -e CAESIUM_RIGHT_SIZING_ENABLED=true \
            -e CAESIUM_CONTRACT_ENFORCEMENT=fail \
            -e CAESIUM_CONTRACT_DEPRECATION_WINDOW=5s \
            -e CAESIUM_CACHE_PIN_DIGESTS=true \
            -e CAESIUM_CACHE_ENABLED=true \
            -e CAESIUM_REGISTRY_AUTH=127.0.0.1=secret://env/CAESIUM_IT_REGISTRY_CREDS \
            -e CAESIUM_IT_REGISTRY_CREDS=ci-user:ci-pass \
            -e CAESIUM_DATABASE_SHARDS=4 \
            -e CAESIUM_FANOUT_MAX_PARTITIONS=8 \
            --user 0:0 \
            caesiumcloud/caesium:${{ env.IMAGE_TAG }}-amd64 start
      - name: Extract caesium CLI
        run: |
          mkdir -p .tmp/caesium-cli
          ctr=$(docker create caesiumcloud/caesium:${{ env.IMAGE_TAG }}-amd64)
          docker cp "$ctr":/bin/caesium .tmp/caesium-cli/caesium
          docker rm -f "$ctr"
          chmod +x .tmp/caesium-cli/caesium
      - name: Full integration suite (Podman, shard ${{ matrix.shard }}/3)
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$(pwd)":/bld/caesium \
            -e CAESIUM_TEST_SHARD_INDEX=${{ matrix.shard }} \
            -e CAESIUM_TEST_SHARD_COUNT=3 \
            -e CAESIUM_TEST_ENGINE=podman \
            -e CAESIUM_RESOURCE_STRESS_IMAGE=caesiumcloud/resource-stress:${{ env.IMAGE_TAG }}-amd64 \
            -v "/run/user/$(id -u)/podman/podman.sock:/run/podman/podman.sock" \
            -e CAESIUM_PODMAN_URI=unix:///run/podman/podman.sock \
            -e CAESIUM_CLI_PATH=/bld/caesium/.tmp/caesium-cli/caesium \
            --network=container:caesium-server-podman \
            -w /bld/caesium \
            caesiumcloud/caesium-integration:${{ env.IMAGE_TAG }}-amd64 \
            sh scripts/integration-test.sh
      - name: Dump Caesium logs on failure
        if: failure()
        run: docker logs caesium-server-podman || true
      - name: Cleanup
        if: always()
        run: docker rm -f caesium-server-podman || true

  build-and-integration-test:
    if: always()
    needs: [changes, images, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Verify required integration matrix
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci-ok.py changes images integration

  build-and-integration-test-agent-auth:
    if: always()
    needs: [changes, images, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Verify required integration matrix
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci-ok.py changes images integration

  # Merge gate. Failure/cancelled of any listed job fails the gate; skipped
  # (path filter) is allowed. Include image producers so a failed `images`
  # job cannot hide behind skipped integration consumers.
  #
  # `early-evidence` is required here (distributed-testing G5) and a green job
  # result alone does not satisfy it: the gate downloads the report that lane
  # uploaded and re-validates it against the committed scenario manifest, bound
  # to this run's candidate SHA. Absent, foreign or hollow evidence fails.
  #
  # distributed-testing G6 promotes the remaining system suites the same way:
  # lifecycle-standalone, generated-fuzz, generated-oracles and
  # coverage-ratchets each upload a lane report that this job downloads and
  # `scripts/ci-ok.py` re-validates under the lane's own manifest gate
  # (`--lane-evidence job=path`). The nightly-only lanes are not in `needs`;
  # ci-ok.py lists them as unpromoted on every run.
  #
  # Since 2026-09-28 (W8, Q6) `ci-ok` is a required status check on master and
  # the merge queue's required check, and it also gates `publish`.
  #
  # distributed-testing G7: the gate also carries this run's full candidate
  # identity (event, tested SHA, base/head SHA) and a base-freshness check.
  # `scripts/ci-ok.py` refuses missing/malformed identity and, on merge_group
  # only, a base SHA that no longer matches master's current tip -- see its
  # module docstring and the Q6 record in
  # docs/exec-plans/active/distributed-testing.md.
  ci-ok:
    if: always()
    needs:
      - changes
      - ci-config
      - builder
      - builder-arm64
      - images
      - images-arm64
      - reagents
      - lint
      - unit-test
      - unit-test-arm64
      - ui-test
      - ui-e2e
      - ui-e2e-auth
      - integration
      - helm-lint
      - early-evidence
      - lifecycle-standalone
      - generated-fuzz
      - generated-oracles
      - coverage-ratchets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      # Only downloadable when the lane actually ran. A lane that ran but left
      # no report still fails the gate: ci-ok.py requires the file.
      - name: Download early-evidence report
        if: needs.early-evidence.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: early-evidence
          path: .tmp/evidence
      - name: Download lifecycle-standalone report
        if: needs.lifecycle-standalone.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: lifecycle-standalone-evidence
          path: .tmp/lane-evidence/lifecycle-standalone
      - name: Download generated-fuzz report
        if: needs.generated-fuzz.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: generated-fuzz-evidence
          path: .tmp/lane-evidence/generated-fuzz
      - name: Download generated-oracles report
        if: needs.generated-oracles.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: generated-oracles-evidence
          path: .tmp/lane-evidence/generated-oracles
      - name: Download coverage-ratchets report
        if: needs.coverage-ratchets.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: coverage-ratchets-evidence
          path: .tmp/lane-evidence/coverage-ratchets
      # Q6/G7 staleness input: master's actual tip at evaluation time, read
      # fresh rather than trusted from any earlier step. A transient failure
      # here must not hard-fail the job -- ci-ok.py's own fail-closed logic
      # decides what an empty result means per event (informational on
      # pull_request, a hard failure on merge_group).
      - name: Determine current master tip (base freshness)
        id: base-freshness
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        continue-on-error: true
        run: |
          sha="$(git ls-remote origin refs/heads/master | cut -f1)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      # Q6/G7: on pull_request, github.sha is a synthetic merge of base+head
      # (refs/pull/N/merge) -- read its REAL parents rather than trusting the
      # event payload's base.sha/head.sha at face value. `git cat-file -p`
      # reads them straight out of the commit object, which is unaffected by
      # the default fetch-depth 1 checkout above: a shallow fetch omits the
      # parent COMMITS, never the parent SHAs recorded in the fetched
      # commit's own header. A transient failure here must not hard-fail the
      # job -- scripts/ci-ok.py's own verify_pull_request_candidate_parents
      # refuses closed on anything other than exactly two parents.
      - name: Read pull_request candidate merge-commit parents
        id: candidate-parents
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          parents="$(git cat-file -p "${{ github.sha }}" | awk '$1 == "parent" { print $2 }' | tr '\n' ' ')"
          echo "parents=$parents" >> "$GITHUB_OUTPUT"
      - name: Evaluate merge gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 scripts/ci-ok.py \
            --evidence-report .tmp/evidence/evidence.json \
            --evidence-manifest test/contracts/scenarios.json \
            --lane-evidence lifecycle-standalone=.tmp/lane-evidence/lifecycle-standalone/evidence.json \
            --lane-evidence generated-fuzz=.tmp/lane-evidence/generated-fuzz/evidence.json \
            --lane-evidence generated-oracles=.tmp/lane-evidence/generated-oracles/evidence.json \
            --lane-evidence coverage-ratchets=.tmp/lane-evidence/coverage-ratchets/evidence.json \
            --candidate-sha "${{ github.sha }}" \
            --event-name "${{ github.event_name }}" \
            --base-sha "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event_name == 'merge_group' && github.event.merge_group.base_sha) || '' }}" \
            --head-sha "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'merge_group' && github.event.merge_group.head_sha) || '' }}" \
            --current-base-sha "${{ steps.base-freshness.outputs.sha }}" \
            --candidate-parents "${{ steps.candidate-parents.outputs.parents }}" \
            changes \
            ci-config \
            builder \
            builder-arm64 \
            images \
            images-arm64 \
            reagents \
            lint \
            unit-test \
            unit-test-arm64 \
            ui-test \
            ui-e2e \
            ui-e2e-auth \
            integration \
            helm-lint \
            early-evidence \
            lifecycle-standalone \
            generated-fuzz \
            generated-oracles \
            coverage-ratchets

  # distributed-testing G4: same-SHA release qualification in the actual
  # publish chain, fail-closed. `publish` needs this job, so a failed, missing,
  # foreign or hollow qualification blocks publication. The required set is
  # scripts/qualification-gate.py RELEASE_REQUIRED: `ci-ok` (which already
  # re-validates the promoted lanes, F4 standalone lifecycle among them), F4's
  # report again under gate `lifecycle`, both native CLI smoke/checksum
  # markers, and the three release-required lanes `qualification` ran on THIS
  # commit (F2 cluster lifecycle, D3 console recovery, B3 core robustness),
  # each bound to github.sha and re-validated under its own manifest gate.
  # Performance and soak are advisory and never required to publish.
  release-qualification:
    if: always() && (startsWith(github.ref, 'refs/tags/v') || inputs.publish-dry-run)
    needs: [changes, ci-ok, images, images-arm64, qualification]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      # Every report this run uploaded, one directory per artifact. A lane that
      # never ran leaves no directory, which the gate refuses as absent
      # evidence; so a failed download is the gate's to judge, not this step's.
      - name: Download this run's lane reports
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: '*-evidence'
          path: .tmp/release/evidence
      - name: Download the native CLI binaries and smoke markers
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: release-cli-*
          path: .tmp/release/cli
          merge-multiple: true
      # DRY RUN ONLY: both inputs exist only on workflow_dispatch, so a tag
      # push can never take this step. It rewrites the F2 cluster lifecycle
      # report into a failed qualification -- the status the collector writes
      # when F2 fails -- and the real gate below, unchanged, must then refuse.
      - name: Simulate a failed release qualification (dry run only)
        if: inputs.publish-dry-run && inputs.simulate-failed-qualification
        run: |
          set -euo pipefail
          report=.tmp/release/evidence/lifecycle-cluster-evidence/evidence.json
          if [ ! -f "$report" ]; then
            echo "SIMULATION: $report is already absent; the gate refuses it as missing"
            exit 0
          fi
          jq '(.scenarios[] | select(.id == "f2-cluster-lifecycle") | .status) = "fail"' "$report" >"$report.tmp"
          mv "$report.tmp" "$report"
          echo "SIMULATION: f2-cluster-lifecycle rewritten to status 'fail' in $report"
      - name: Evaluate release qualification
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          LANE_RESULTS_JSON: ${{ needs.qualification.outputs.results }}
          DRY_RUN: ${{ inputs.publish-dry-run && 'true' || 'false' }}
        run: |
          python3 scripts/qualification-gate.py release \
            --candidate-sha "$GITHUB_SHA" \
            --ref "$GITHUB_REF" \
            --dry-run "$DRY_RUN" \
            --evidence-dir .tmp/release/evidence \
            --cli-dir .tmp/release/cli \
            --manifest test/contracts/scenarios.json

  # A `publish-dry-run` dispatch runs this job's verification steps (the
  # native CLI smoke markers and checksums) and skips every step that logs in,
  # pushes or creates a release; it also binds no deployment environment.
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish-dry-run
    needs:
      - ci-ok
      - release-qualification
      - lint
      - unit-test
      - unit-test-arm64
      - ui-test
      - ui-e2e
      - ui-e2e-auth
      - images
      - images-arm64
      - reagents
      - reagents-arm64
      - integration
      - integration-extra
      - integration-arm64
      - helm-lint
      - helm-integration-test
      - helm-pod-replacement-test
      - podman-integration-test
    runs-on: ubuntu-24.04
    # A dry run evaluates to '' (no environment, so no deployment record and
    # none of its secrets). The operand order matters: `cond && '' || x` would
    # always yield x, because '' is falsy.
    environment: ${{ !inputs.publish-dry-run && 'Docker' || '' }}
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Verify chart appVersion matches the pushed tag
        if: ${{ !inputs.publish-dry-run }}
        run: |
          grep -q "^appVersion: \"${GITHUB_REF_NAME}\"$" helm/caesium/Chart.yaml || {
            echo "helm/caesium/Chart.yaml appVersion does not equal the pushed tag ${GITHUB_REF_NAME}:"
            grep '^appVersion:' helm/caesium/Chart.yaml
            echo "Every v* tag bumps Chart.yaml appVersion to the tag (and version per semver) in the same PR."
            exit 1
          }
      - uses: ./.github/actions/load-docker-images
        with:
          name: product-amd64
      - uses: ./.github/actions/load-docker-images
        with:
          name: product-arm64
      - uses: ./.github/actions/load-docker-images
        with:
          name: reagents-amd64
      - uses: ./.github/actions/load-docker-images
        with:
          name: reagents-arm64
      - uses: actions/download-artifact@v8
        with:
          name: release-cli-amd64
          path: /tmp/cli
      - uses: actions/download-artifact@v8
        with:
          name: release-cli-arm64
          path: /tmp/cli
      - name: Verify CLI smoke markers and checksums
        run: |
          set -euo pipefail
          cd /tmp/cli
          for arch in amd64 arm64; do
            bin="caesium-linux-${arch}"
            marker="${bin}.smoke-ok"
            test -f "$bin" || { echo "missing $bin"; exit 1; }
            test -f "$marker" || {
              echo "missing $marker - the $arch build job did not smoke-test its binary"
              exit 1
            }
            expected="$(sed -n 's/^sha256=//p' "$marker")"
            actual="$(sha256sum "$bin" | awk '{print $1}')"
            if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
              echo "sha256 mismatch for $bin: marker='$expected' actual='$actual'"
              exit 1
            fi
            echo "verified $bin ($actual)"
            cat "$marker"
          done
          sha256sum caesium-linux-amd64 caesium-linux-arm64 > SHA256SUMS
          cat SHA256SUMS
      # Everything below the verification steps writes outside this run; a
      # publish dry run skips all of it.
      - name: Login to Docker Hub
        if: ${{ !inputs.publish-dry-run }}
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      - name: Push multi-arch manifest
        if: ${{ !inputs.publish-dry-run }}
        run: |
          IMAGE_TAG=${{ env.IMAGE_TAG }}
          docker push caesiumcloud/caesium:${IMAGE_TAG}-amd64
          docker push caesiumcloud/caesium:${IMAGE_TAG}-arm64
          docker manifest create caesiumcloud/caesium:${IMAGE_TAG} \
            caesiumcloud/caesium:${IMAGE_TAG}-amd64 \
            caesiumcloud/caesium:${IMAGE_TAG}-arm64
          docker manifest push caesiumcloud/caesium:${IMAGE_TAG}
      - name: Push stress fixture multi-arch manifest
        if: ${{ !inputs.publish-dry-run }}
        run: |
          IMAGE_TAG=${{ env.IMAGE_TAG }}
          docker push caesiumcloud/resource-stress:${IMAGE_TAG}-amd64
          docker push caesiumcloud/resource-stress:${IMAGE_TAG}-arm64
          docker manifest create caesiumcloud/resource-stress:${IMAGE_TAG} \
            caesiumcloud/resource-stress:${IMAGE_TAG}-amd64 \
            caesiumcloud/resource-stress:${IMAGE_TAG}-arm64
          docker manifest push caesiumcloud/resource-stress:${IMAGE_TAG}
      - name: Push reagent multi-arch manifests
        if: ${{ !inputs.publish-dry-run }}
        run: |
          IMAGE_TAG=${{ env.IMAGE_TAG }}
          for role in git-source tf-discover tf-warm tf-runner; do
            docker push caesiumcloud/$role:${IMAGE_TAG}-amd64
            docker push caesiumcloud/$role:${IMAGE_TAG}-arm64
            docker manifest create caesiumcloud/$role:${IMAGE_TAG} \
              caesiumcloud/$role:${IMAGE_TAG}-amd64 \
              caesiumcloud/$role:${IMAGE_TAG}-arm64
            docker manifest push caesiumcloud/$role:${IMAGE_TAG}
          done
      - name: Create GitHub Release
        if: ${{ !inputs.publish-dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IMAGE_TAG=${{ env.IMAGE_TAG }}
          amd64_digest="$(docker inspect --format '{{index .RepoDigests 0}}' caesiumcloud/caesium:${IMAGE_TAG}-amd64)"
          arm64_digest="$(docker inspect --format '{{index .RepoDigests 0}}' caesiumcloud/caesium:${IMAGE_TAG}-arm64)"
          cat > /tmp/release-notes.md <<EOF
          ## Install

          ### CLI binary (Linux only)

          \`caesium-linux-amd64\` and \`caesium-linux-arm64\` are **statically
          linked** executables: they need no shared libraries and run on any
          Linux host of the matching architecture. Verify against
          \`SHA256SUMS\`, then:

          \`\`\`sh
          curl -fsSLo caesium https://github.com/${GITHUB_REPOSITORY}/releases/download/${IMAGE_TAG}/caesium-linux-\$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          chmod +x caesium && sudo mv caesium /usr/local/bin/caesium
          caesium --help
          \`\`\`

          There is **no macOS or Windows binary**: the toolchain builds
          \`GOOS=linux\` against a CGO dqlite. On macOS run the CLI through the
          container image instead — \`just tag=${IMAGE_TAG} cli\` writes a
          wrapper to \`./.tmp/caesium-cli/caesium\`.

          Each binary was smoke-tested **natively on its own architecture's
          runner** (\`ubuntu-24.04\` / \`ubuntu-24.04-arm\`, no emulation) inside
          a plain \`ubuntu:24.04\` container carrying none of the caesium
          runtime libraries: \`caesium --help\` and \`caesium job lint\` both
          succeed there.

          ### Container image

          \`\`\`sh
          docker pull caesiumcloud/caesium:${IMAGE_TAG}
          \`\`\`

          | Platform | Digest |
          |---|---|
          | linux/amd64 | \`${amd64_digest}\` |
          | linux/arm64 | \`${arm64_digest}\` |

          ### Helm

          \`helm/caesium\` \`appVersion\` is pinned to \`${IMAGE_TAG}\`, so an
          un-overridden \`helm install caesium ./helm/caesium\` deploys this
          release.
          EOF
          assets=(/tmp/cli/caesium-linux-amd64 /tmp/cli/caesium-linux-arm64 /tmp/cli/SHA256SUMS)
          if gh release view "${IMAGE_TAG}" >/dev/null 2>&1; then
            echo "release ${IMAGE_TAG} already exists; re-uploading assets with --clobber"
            gh release upload "${IMAGE_TAG}" --clobber "${assets[@]}"
          else
            gh release create "${IMAGE_TAG}" \
              --verify-tag \
              --title "${IMAGE_TAG}" \
              --notes-file /tmp/release-notes.md \
              "${assets[@]}"
          fi
      - name: Publish dry run (nothing pushed)
        if: inputs.publish-dry-run
        run: |
          {
            echo "### Publish dry run"
            echo ""
            echo "release-qualification passed and the CLI smoke markers and checksums above verified on \`${GITHUB_SHA}\`."
            echo "Skipped (dry run): the chart/tag check, Docker Hub login, the caesium, stress fixture and reagent manifest pushes and the GitHub release."
          } | tee -a "$GITHUB_STEP_SUMMARY"
