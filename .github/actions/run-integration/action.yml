name: Run integration lane
description: Load the pre-built images and run a just integration-* recipe without recompiling.

inputs:
  arch:
    description: amd64 or arm64
    required: true
  recipe:
    description: justfile recipe (integration-test, integration-test-agent, …)
    required: true
  load-triage:
    description: Load the triage-agent image artifact
    default: "false"
  load-reagents:
    description: Load the reagent role image artifact
    default: "false"
  load-robustness:
    description: Load the robustness runner image artifact (early-evidence lane)
    default: "false"
  verify-native-stress:
    description: Qualify the loaded stress image on this consumer's native Docker runtime
    default: "false"
  shard-index:
    description: One-based shard index (empty runs the unsharded suite)
    default: ""
  shard-count:
    description: Total full-suite shards (empty runs the unsharded suite)
    default: ""

runs:
  using: composite
  steps:
    - uses: taiki-e/install-action@just
    - uses: ./.github/actions/load-docker-images
      with:
          name: integration-runner-${{ inputs.arch }}
    - uses: ./.github/actions/load-docker-images
      with:
        name: product-${{ inputs.arch }}
    - if: ${{ inputs.load-triage == 'true' }}
      uses: ./.github/actions/load-docker-images
      with:
        name: triage-${{ inputs.arch }}
    - if: ${{ inputs.load-reagents == 'true' }}
      uses: ./.github/actions/load-docker-images
      with:
        name: reagents-${{ inputs.arch }}
    - if: ${{ inputs.load-robustness == 'true' }}
      uses: ./.github/actions/load-docker-images
      with:
        name: robustness-${{ inputs.arch }}
    - name: Verify native resource stress runtime
      id: native_stress
      if: ${{ inputs.verify-native-stress == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        date +%s >"$RUNNER_TEMP/stress-smoke.since"
        bash build/stress/smoke.sh docker caesiumcloud/resource-stress:${{ env.IMAGE_TAG }}-${{ inputs.arch }} 2>&1 | tee "$RUNNER_TEMP/stress-smoke.log"
    - name: Observe native stress host
      if: ${{ always() && inputs.verify-native-stress == 'true' && steps.native_stress.outcome != 'skipped' }}
      shell: bash
      run: sudo -n --preserve-env=GITHUB_SHA,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT python3 scripts/collect-stress-host-diagnostics.py --smoke-log "$RUNNER_TEMP/stress-smoke.log" --since "$(cat "$RUNNER_TEMP/stress-smoke.since")"
    - name: Run ${{ inputs.recipe }}
      shell: bash
      env:
        CAESIUM_SKIP_IMAGE_BUILD: "true"
        CAESIUM_INTEGRATION_RUNNER_IMAGE: caesiumcloud/caesium-integration:${{ env.IMAGE_TAG }}-${{ inputs.arch }}
        CAESIUM_TEST_SHARD_INDEX: ${{ inputs.shard-index }}
        CAESIUM_TEST_SHARD_COUNT: ${{ inputs.shard-count }}
      run: just tag=${{ env.IMAGE_TAG }}-${{ inputs.arch }} ${{ inputs.recipe }}
