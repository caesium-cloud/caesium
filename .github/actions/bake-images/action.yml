name: Bake cached CI images
description: Persist BuildKit layers and Go compilation caches for each native architecture.
inputs:
  arch:
    description: Native architecture (amd64 or arm64)
    required: true
  targets:
    description: Bake group (product, reagents or reagent-roles)
    required: true
  cache-group:
    description: Independent compilation cache namespace (product or reagents)
    required: true
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v3
      id: buildx
    # BuildKit's GHA layer exporter does not preserve RUN cache mounts. Restore
    # these separately and extract them in the post step before cache's save.
    - uses: actions/cache@v4
      id: compilation-cache
      with:
        path: ${{ runner.temp }}/caesium-build-cache
        # Dependency/toolchain snapshots amortize the expensive cache export.
        # Source-only changes reuse compiled dependencies without uploading
        # another ~500 MB snapshot on every commit. Go validates source hashes.
        key: compile-v1-${{ inputs.cache-group }}-${{ inputs.arch }}-${{ hashFiles('build/Dockerfile*', '**/go.mod', '**/go.sum', 'ui/package-lock.json') }}
        restore-keys: |
          compile-v1-${{ inputs.cache-group }}-${{ inputs.arch }}-
    - uses: reproducible-containers/buildkit-cache-dance@5b81f4d29dc8397a7d341dba3aeecc7ec54d6361 # v3.3.0
      with:
        builder: ${{ steps.buildx.outputs.name }}
        scratch-dir: ${{ runner.temp }}/caesium-cache-dance
        cache-map: |
          {
            "${{ runner.temp }}/caesium-build-cache/go": "/root/.cache/go-build",
            "${{ runner.temp }}/caesium-build-cache/npm": "/root/.npm"
          }
        skip-extraction: ${{ steps.compilation-cache.outputs.cache-hit == 'true' }}
    - uses: docker/bake-action@v6
      env:
        IMAGE_TAG: ${{ env.IMAGE_TAG }}-${{ inputs.arch }}
        CACHE_ARCH: ${{ inputs.arch }}
      with:
        files: |
          build/ci.docker-bake.hcl
          build/ci.docker-bake-cache.hcl
        targets: ${{ inputs.targets }}
        load: true
        provenance: false
        sbom: false
