# Keycloak lane fixture (plan item G1): one job per namespace, applied by
# justfile integration-up-keycloak with the bootstrap admin key. The cron
# fires once a year, so the lane never runs it.
apiVersion: v1
kind: Job
metadata:
  alias: kc-lane-finance
  namespace: finance
trigger:
  type: cron
  configuration:
    cron: "0 0 1 1 *"
    timezone: "UTC"
steps:
  - name: noop
    image: alpine:3.23
    command: ["sh", "-c", "echo keycloak lane finance job"]
