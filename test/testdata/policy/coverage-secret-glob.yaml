# Mounted on the local coverage-ratchet server (auth mode none). Startup
# validates these globs in-process so internal/auth/policy/glob.go is in the
# integration profile. default and finance have no secret rules, which keeps
# allow-all. finance is declared because TestCacheNamespaceMove applies a job
# there, and a loaded policy rejects an undeclared namespace. marketing's run
# quota of one matches two-namespaces.yaml, so the namespace quota scenarios
# (test/namespace_quota_test.go, CAESIUM_IT_POLICY_FIXTURE=coverage-secret-glob)
# drive the quota paths on this server too.
apiVersion: v1
kind: AccessPolicy
namespaces:
  default: {}
  marketing:
    secrets:
      allow:
        - env/MARKETING_*
        - k8s/caesium-marketing/token
        - vault/secret/data/marketing/*
    quotas:
      maxConcurrentRuns: 1
  finance: {}
bindings:
  - subjects:
      groups: ["coverage-secret-glob"]
    role: viewer
    namespaces: ["marketing"]
