# Access policy mounted on the auth integration lane (justfile
# integration-up-agent seeds .tmp/auth-policy/policy.yaml from this file).
# TestAuthPolicyReload and TestAuthPolicyPollReload rewrite the served copy
# and restore it. Bind only groups no other scenario seeds: in particular,
# never caesium-admins (TestAuthSessionCookieWithoutGrantsIsRefused) and
# never the "*" group wildcard.
apiVersion: v1
kind: AccessPolicy
namespaces:
  default: {}
bindings:
  - subjects:
      groups: ["iaa-reload-viewers"]
    role: viewer
    namespaces: ["*"]
